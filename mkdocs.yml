site_name: orq.ai workshop
site_description: Hands-on training for orq.ai. Gateway, guardrails, tracing, evals, agents, RAG, MCP, simulation, red teaming, coding agents.
site_url: https://orq-ai.github.io/orq-workshop/
repo_url: https://github.com/orq-ai/orq-workshop
repo_name: orq-ai/orq-workshop
docs_dir: docs

# `mkdocs serve` watches docs_dir, the config and the hooks. Module lessons are
# snippet-included from modules/, so without this an edit there shows nothing until restart.
watch:
  - modules
copyright: "© 2026 orq.ai · MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/orq-symbol-dark.svg
  favicon: assets/orq-favicon.svg
  font: false
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: "Switch to light mode" }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: "Switch to dark mode" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: "Switch to system preference" }

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - js/keyboard.js
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - redirects:
      redirect_maps:
        modules/00.md: modules/setup.md
        agenda.md: start/core-path.md
        setup/orqi.md: start/orqi.md
        modules/01.md: modules/gateway.md
        modules/02.md: modules/tracing.md
        modules/03.md: modules/smart-routing.md
        modules/04.md: modules/guardrails.md
        modules/05.md: modules/budgets-and-keys.md
        modules/06.md: modules/orqi.md
        modules/07.md: modules/failure-analysis.md
        modules/08.md: modules/managed-agents.md
        modules/09.md: modules/knowledge-base.md
        modules/10.md: modules/mcp-gateway.md
        modules/11.md: modules/simulation.md
        modules/12.md: modules/evals-in-ci.md
        modules/13.md: modules/coding-agents.md
        modules/14.md: modules/alerts-and-webhooks.md
        modules/15.md: modules/advisor-and-sidekick.md
        modules/16.md: modules/red-teaming.md
        modules/17.md: modules/annotation-queues.md
        modules/18.md: modules/trace-insights.md
        modules/07-concepts.md: modules/failure-analysis/concepts.md
        modules/08-concepts.md: modules/managed-agents/concepts.md
        modules/11-concepts.md: modules/simulation/concepts.md
        modules/08-logic.md: modules/managed-agents/logic.md
        modules/08-solution-design.md: modules/managed-agents/solution-design.md
        modules/07-evaluate.md: modules/failure-analysis/evaluate.md
        own-your-agent.md: build/index.md
  - glightbox:
      touchNavigation: true
      zoomable: true
      skip_classes:
        - md-logo
  - termynal:
      buttons: macos
      prompt_literal_start:
        - "$"
        - ">>>"

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - start/index.md
      - For leaders: start/for-leaders.md
      - For engineers: start/for-engineers.md
      - Already on orq.ai: start/already-on-orq.md
      - Setup: modules/setup.md
      - The core path: start/core-path.md
      - Harnesses:
          - Coding agents: modules/coding-agents.md
          - orqi harness: start/orqi.md
          - Troubleshooting with orqi: modules/orqi.md
      - Wrap-up: start/wrap-up.md
      - Past sessions:
          - TechDays 15 Oct: sessions/techdays-2026.md
  - Build:
      - build/index.md
      - Managed agents:
          - Foundations: modules/managed-agents/concepts.md
          - Use case: modules/managed-agents/logic.md
          - Agent design: modules/managed-agents/solution-design.md
          - Build: modules/managed-agents.md
      - Knowledge base and RAG: modules/knowledge-base.md
      - MCP servers and gateway: modules/mcp-gateway.md
      - Advisor and sidekick: modules/advisor-and-sidekick.md
  - Route and protect:
      - route/index.md
      - Gateway: modules/gateway.md
      - Smart routing and routing rules: modules/smart-routing.md
      - Guardrails: modules/guardrails.md
      - Budgets and keys: modules/budgets-and-keys.md
  - Trace:
      - trace/index.md
      - Tracing: modules/tracing.md
  - Find failures:
      - find-failures/index.md
      - Failure analysis:
          - Concepts: modules/failure-analysis/concepts.md
          - Find and fix: modules/failure-analysis.md
      - Trace insights: modules/trace-insights.md
      - Annotation queues and automations: modules/annotation-queues.md
  - Evaluate:
      - evaluate/index.md
      - Evaluators and experiments: modules/evaluators-and-experiments.md
      - Agent simulation:
          - Concepts: modules/simulation/concepts.md
          - Run: modules/simulation.md
      - Red teaming: modules/red-teaming.md
  - Gate and monitor:
      - gate/index.md
      - Evals and agents in CI: modules/evals-in-ci.md
      - Alerts and webhooks: modules/alerts-and-webhooks.md
  - Reference:
      - Cheat sheet: reference/cheat-sheet.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
      - Known issues: reference/known-issues.md
      - Terraform: reference/terraform.md
      - evaluatorq: reference/evaluatorq.md
      - orq-arena: reference/orq-arena.md
      - How retrieval works: reference/rag.md
