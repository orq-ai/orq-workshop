site_name: orq.ai workshop
site_description: Hands-on training for orq.ai. Gateway, guardrails, tracing, evals, agents, RAG, MCP, simulation, red teaming, coding agents.
site_url: https://orq-ai.github.io/orq-workshop/
repo_url: https://github.com/orq-ai/orq-workshop
repo_name: orq-ai/orq-workshop
docs_dir: docs

# `mkdocs serve` watches docs_dir, the config and the hooks. Module lessons are
# snippet-included from modules/, so without this an edit there shows nothing until restart.
watch:
  - modules
copyright: "© 2026 Orq AI · MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/orq-mark-white.svg
  favicon: assets/orq-favicon.svg
  font: false
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch light mode }

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - js/keyboard.js
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true
      skip_classes:
        - md-logo
  - termynal:
      prompt_literal_start:
        - "$"
        - ">>>"

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Agenda: agenda.md
      - What's new in orq: whats-new.md
  - Setup:
      - Setup CLI: modules/00.md
      - Coding agents: modules/13.md
      - Setup Orqi : setup/orqi.md
      - Troubleshooting with orqi: modules/06.md
  - AI Gateway:
      - Gateway: modules/01.md
      - Smart routing and routing rules: modules/03.md
      - Guardrails: modules/04.md
      - Budgets and keys: modules/05.md
      - MCP servers and gateway: modules/10.md
      - Terraform: reference/terraform.md
  - AI Observability:
      - Tracing: modules/02.md
      - Alerts and webhooks: modules/14.md
      - Annotation queues and automations: modules/17.md
  - Agents:
      - own-your-agent.md
      - Managed agents: modules/08.md
      - Advisor and sidekick: modules/15.md
  - RAG and Retrieval:
      - reference/rag.md
      - Knowledge base and RAG: modules/09.md
  - Evaluation:
      - reference/evaluatorq.md
      - reference/orq-arena.md
      - Evals and agents in CI: modules/12.md
      - Agent simulation: modules/11.md
      - Red teaming: modules/16.md
      - Failure analysis to experiments: modules/07.md
  - Reference:
      - Cheat sheet: reference/cheat-sheet.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
