site_name: orq.ai workshop
site_description: Hands-on training for orq.ai. Gateway, guardrails, tracing, evals, agents, RAG, MCP, simulation, red teaming, coding agents.
site_url: https://orq-ai.github.io/orq-workshop/
repo_url: https://github.com/orq-ai/orq-workshop
repo_name: orq-ai/orq-workshop
docs_dir: docs

# `mkdocs serve` watches docs_dir, the config and the hooks. Module lessons are
# snippet-included from modules/, so without this an edit there shows nothing until restart.
watch:
  - modules
copyright: "© 2026 orq.ai · MIT License"

theme:
  name: material
  custom_dir: overrides
  logo: assets/orq-symbol-dark.svg
  favicon: assets/orq-favicon.svg
  font: false
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: "Switch to light mode" }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: "Switch to dark mode" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: "Switch to system preference" }

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - js/keyboard.js
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true
      skip_classes:
        - md-logo
  - termynal:
      buttons: macos
      prompt_literal_start:
        - "$"
        - ">>>"

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Agenda: agenda.md
  - Setup:
      - Setup CLI: modules/setup.md
      - Coding agents: modules/coding-agents.md
      - orqi harness: setup/orqi.md
      - Troubleshooting with orqi: modules/orqi.md
  - AI Gateway:
      - Gateway: modules/gateway.md
      - Smart routing and routing rules: modules/smart-routing.md
      - Guardrails: modules/guardrails.md
      - MCP servers and gateway: modules/mcp-gateway.md
  - AI Observability:
      - Tracing: modules/tracing.md
      - Alerts and webhooks: modules/alerts-and-webhooks.md
      - Annotation queues and automations: modules/annotation-queues.md
  - Managed agents:
      - own-your-agent.md
      - Managed agents:
          - Foundations: modules/managed-agents/concepts.md
          - Use case: modules/managed-agents/logic.md
          - Agent design: modules/managed-agents/solution-design.md
          - Build: modules/managed-agents.md
      - Advisor and sidekick: modules/advisor-and-sidekick.md
  - RAG and Retrieval:
      - reference/rag.md
      - Knowledge base and RAG: modules/knowledge-base.md
  - Evaluation:
      - reference/evaluatorq.md
      - reference/orq-arena.md
      - Evals and agents in CI: modules/evals-in-ci.md
      - Agent simulation:
          - Concepts: modules/simulation/concepts.md
          - Run: modules/simulation.md
      - Trace insights: modules/trace-insights.md
      - Red teaming: modules/red-teaming.md
      - Failure analysis to experiments:
          - Concepts: modules/failure-analysis/concepts.md
          - Find and fix: modules/failure-analysis.md
          - Evaluate: modules/failure-analysis/evaluate.md
  - Past sessions:
      - TechDays 15 Oct: sessions/techdays-2026.md
  - Administration:
      - Budgets and keys: modules/budgets-and-keys.md
      - Terraform: reference/terraform.md
  - Reference:
      - Cheat sheet: reference/cheat-sheet.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
