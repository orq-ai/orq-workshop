[project]
name = "orq-workshop"
version = "0.1.0"
description = "Hands-on orq.ai workshop: gateway, guardrails, tracing, evals, agents, RAG, MCP, simulation, red teaming, coding agents."
requires-python = ">=3.11,<3.14"
dependencies = [
    "orq-ai-sdk>=4.14,<5",
    "openai>=1.60",
    "evaluatorq[redteam]>=1.38",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.3", "langchain-core>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "termynal>=0.12",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
