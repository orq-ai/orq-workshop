<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 992" width="1920" height="992" role="img" aria-labelledby="review-loop-title review-loop-desc">
  <title id="review-loop-title">The annotation queue review loop</title>
  <desc id="review-loop-desc">Architecture diagram: refund-agent traces reach the annotation queue ws-review-queue either through a Studio trace automation or through the add_items API; a reviewer, in the Studio or through the Annotations API, applies a rating and a defect to each queued span, which marks it reviewed; the bad ones are promoted as rows into the dataset ws-review-dataset, which the evaluators-and-experiments module's experiments run on.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="992" class="bg"/>
  <!-- Layout (x,y,w,h):
       Traces        48,152,160,56
       Automation    288,80,160,56 (Studio-only)     add_items 288,224,160,56
       Queue (focal) 528,152,160,56
       Reviewer      528,288,160,56
       Dataset       768,152,144,56                  Experiment 768,288,144,56 -->
  <!-- Arrows first -->
  <!-- A1 Traces → Automation (right + up) -->
  <path d="M 416 336 H 480 Q 496 336 496 320 V 232 Q 496 216 512 216 H 576" class="arrow dash"/>
  <!-- A2 Traces → add_items (right + down) -->
  <path d="M 416 384 H 480 Q 496 384 496 400 V 488 Q 496 504 512 504 H 576" class="link"/>
  <!-- A3 Automation → Queue (right + down) -->
  <path d="M 896 216 H 960 Q 976 216 976 232 V 320 Q 976 336 992 336 H 1056" class="arrow dash"/>
  <!-- A4 add_items → Queue (right + up) -->
  <path d="M 896 504 H 960 Q 976 504 976 488 V 400 Q 976 384 992 384 H 1056" class="link"/>
  <!-- A5 Queue ↔ Reviewer: queue → reviewer (down, x=592), reviewer → queue (up, x=624) -->
  <line x1="1184" y1="416" x2="1184" y2="576" class="arrow"/>
  <line x1="1248" y1="576" x2="1248" y2="416" class="accent"/>
  <!-- A6 Queue → Dataset (same y) -->
  <line x1="1376" y1="360" x2="1536" y2="360" class="accent"/>
  <!-- A7 Dataset → Experiment (down, same x) -->
  <line x1="1680" y1="416" x2="1680" y2="576" class="arrow"/>
  <!-- Arrow labels -->
  <rect x="424" y="240" width="64" height="24" rx="4" class="mask"/>
  <text x="432" y="258" class="lbl">ALL</text>
  <rect x="424" y="512" width="72" height="24" rx="4" class="mask"/>
  <text x="432" y="530" class="lbl">PICK</text>
  <rect x="896" y="176" width="144" height="24" rx="4" class="mask"/>
  <text x="904" y="194" class="lbl">FILTER MATCH</text>
  <rect x="896" y="520" width="144" height="24" rx="4" class="mask"/>
  <text x="904" y="538" class="lbl">ROOT SPAN</text>
  <rect x="1024" y="480" width="144" height="24" rx="4" class="mask"/>
  <text x="1160" y="498" text-anchor="end" class="lbl">NEXT ITEM</text>
  <rect x="1264" y="480" width="176" height="24" rx="4" class="mask"/>
  <text x="1272" y="498" class="lbl t-accent">RATING, DEFECT</text>
  <rect x="1392" y="320" width="128" height="24" rx="4" class="mask"/>
  <text x="1456" y="338" text-anchor="middle" class="lbl t-accent">BAD ONES</text>
  <rect x="1704" y="480" width="128" height="24" rx="4" class="mask"/>
  <text x="1712" y="498" class="lbl">EVALUATORS</text>
  <!-- Node: Traces (store) -->
  <rect x="96" y="304" width="320" height="112" rx="16" class="mask"/>
  <rect x="96" y="304" width="320" height="112" rx="16" class="soft"/>
  <rect x="112" y="320" width="72" height="24" rx="4" class="tag-box"/>
  <text x="148" y="338" text-anchor="middle" class="tag">STORE</text>
  <text x="256" y="368" text-anchor="middle" class="name">Traces</text>
  <text x="256" y="398" text-anchor="middle" class="sub">agent = ws-refund-agent</text>
  <!-- Node: Automation (Studio-only) -->
  <rect x="576" y="160" width="320" height="112" rx="16" class="mask"/>
  <rect x="576" y="160" width="320" height="112" rx="16" class="quiet"/>
  <rect x="592" y="176" width="88" height="24" rx="4" class="tag-box mute"/>
  <text x="636" y="194" text-anchor="middle" class="tag t-mute">STUDIO</text>
  <text x="736" y="224" text-anchor="middle" class="name">Trace automation</text>
  <text x="736" y="254" text-anchor="middle" class="sub">filter · sample · action</text>
  <!-- Node: add_items (API) -->
  <rect x="576" y="448" width="320" height="112" rx="16" class="mask"/>
  <rect x="576" y="448" width="320" height="112" rx="16" class="node"/>
  <rect x="592" y="464" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="620" y="482" text-anchor="middle" class="tag t-ink">API</text>
  <text x="736" y="512" text-anchor="middle" class="name">Your code</text>
  <text x="736" y="542" text-anchor="middle" class="sub">add_items(root span)</text>
  <!-- Node: Queue (focal) -->
  <rect x="1056" y="304" width="320" height="112" rx="16" class="mask"/>
  <rect x="1056" y="304" width="320" height="112" rx="16" class="focal"/>
  <rect x="1072" y="320" width="72" height="24" rx="4" class="tag-box accent"/>
  <text x="1108" y="338" text-anchor="middle" class="tag t-accent">QUEUE</text>
  <text x="1216" y="368" text-anchor="middle" class="name">ws-review-queue</text>
  <text x="1216" y="398" text-anchor="middle" class="sub">items = spans</text>
  <!-- Node: Reviewer (human or API) -->
  <rect x="1056" y="576" width="320" height="112" rx="16" class="mask"/>
  <rect x="1056" y="576" width="320" height="112" rx="16" class="soft"/>
  <rect x="1072" y="592" width="88" height="24" rx="4" class="tag-box"/>
  <text x="1116" y="610" text-anchor="middle" class="tag">HUMAN</text>
  <text x="1216" y="640" text-anchor="middle" class="name">Reviewer</text>
  <text x="1216" y="670" text-anchor="middle" class="sub">Studio, or Annotations API</text>
  <!-- Node: Dataset (store) -->
  <rect x="1536" y="304" width="288" height="112" rx="16" class="mask"/>
  <rect x="1536" y="304" width="288" height="112" rx="16" class="soft"/>
  <rect x="1552" y="320" width="72" height="24" rx="4" class="tag-box"/>
  <text x="1588" y="338" text-anchor="middle" class="tag">STORE</text>
  <text x="1680" y="368" text-anchor="middle" class="name">ws-review-dataset</text>
  <text x="1680" y="398" text-anchor="middle" class="sub fit">message · expected_output</text>
  <!-- Node: Experiment -->
  <rect x="1536" y="576" width="288" height="112" rx="16" class="mask"/>
  <rect x="1536" y="576" width="288" height="112" rx="16" class="node"/>
  <rect x="1552" y="592" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="1580" y="610" text-anchor="middle" class="tag t-ink">RUN</text>
  <text x="1680" y="640" text-anchor="middle" class="name">Experiment</text>
  <text x="1680" y="670" text-anchor="middle" class="sub">the evaluators module</text>
  <!-- Callout -->
  <path d="M 464 784 Q 600 776 1056 688" class="faint dash"/>
  <circle cx="1056" cy="688" r="4" class="dot"/>
  <text x="80" y="824" class="note">A review is one annotation on the queued span. The dataset row keeps the correction,</text>
  <text x="80" y="860" class="note">not the verdict: annotations stay on the trace.</text>
  <!-- Legend strip -->
  <line x1="80" y1="904" x2="1840" y2="904" class="hair"/>
  <text x="80" y="936" class="legend-title">LEGEND</text>
  <rect x="80" y="960" width="28" height="20" rx="4" class="focal"/>
  <text x="120" y="976" class="msg">Where the human loop lives</text>
  <rect x="496" y="960" width="28" height="20" rx="4" class="quiet"/>
  <text x="536" y="976" class="msg">Studio-only, no API</text>
  <line x1="864" y1="972" x2="920" y2="972" class="link"/>
  <text x="936" y="976" class="msg">API call from your code</text>
  <line x1="1272" y1="972" x2="1328" y2="972" class="accent"/>
  <text x="1344" y="976" class="msg">A verdict, then a promotion</text>
    
</svg>
