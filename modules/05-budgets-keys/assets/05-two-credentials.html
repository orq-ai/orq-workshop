<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two credentials, two jobs · Module 05</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Module 05</p>
    <h1>Two credentials, two jobs</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="two-credentials-title two-credentials-desc">
      <title id="two-credentials-title">API key and Management Key: what each one can reach</title>
      <desc id="two-credentials-desc">Architecture diagram for module 05. An API key calls models through the AI Gateway and is scoped by project and permission mode, but it is refused with 403 on the admin endpoints. A Management Key administers API keys and budgets, cannot call models, and cannot delete itself.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Arrows first: z-order puts them behind the nodes. -->
      <line x1="268" y1="120" x2="268" y2="200" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="268" y1="264" x2="268" y2="344" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="692" y1="120" x2="692" y2="200" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- The refusal: an API key reaching for the admin surface. -->
      <path d="M 360,120 V 152 Q 360,160 368,160 H 632 Q 640,160 640,168 V 200" fill="none" stroke="#df5325" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels: masked, clear of the strokes, on open canvas. -->
      <rect x="276" y="140" width="112" height="12" rx="2" fill="#f9f8f6"/>
      <text x="280" y="149" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">CHAT / RESPONSES</text>

      <rect x="276" y="292" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="280" y="301" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">MODEL CALL</text>

      <rect x="700" y="140" width="92" height="12" rx="2" fill="#f9f8f6"/>
      <text x="704" y="149" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">ADMIN CALLS</text>

      <rect x="424" y="132" width="136" height="12" rx="2" fill="#f9f8f6"/>
      <text x="428" y="141" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">403 NOT AUTHORIZED</text>

      <!-- Node: API key -->
      <rect x="72" y="56" width="392" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="56" width="392" height="64" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="80" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="94" y="73" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
      <text x="268" y="92" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">API key</text>
      <text x="268" y="108" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">calls models · scoped by project and permission mode</text>

      <!-- Node: Management Key (focal: the unfamiliar credential) -->
      <rect x="496" y="56" width="392" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="496" y="56" width="392" height="64" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="504" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="518" y="73" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MGMT</text>
      <text x="692" y="92" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Management Key</text>
      <text x="692" y="108" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">administers keys and budgets · cannot call models</text>

      <!-- Node: AI Gateway -->
      <rect x="72" y="200" width="392" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="200" width="392" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="80" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="94" y="217" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="268" y="236" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">AI Gateway</text>
      <text x="268" y="252" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">budgets are enforced here, before the provider</text>

      <!-- Node: Admin API -->
      <rect x="496" y="200" width="392" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="496" y="200" width="392" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="504" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="518" y="217" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="692" y="236" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Admin endpoints</text>
      <text x="692" y="252" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">/v2/api-keys · /v2/budgets · /v2/management-keys</text>

      <!-- Node: Models -->
      <rect x="72" y="344" width="392" height="48" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="344" width="392" height="48" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="80" y="352" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="94" y="361" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="268" y="364" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Models</text>
      <text x="268" y="380" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">the spend a budget is there to cap</text>

      <!-- Editorial aside: the self-delete rule, where it bites in step 5 -->
      <text x="692" y="300" fill="#6b6975" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">a Management Key cannot delete itself — the CLI session does that</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="60" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">API key</text>

      <rect x="136" y="472" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="156" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Management Key</text>

      <rect x="284" y="472" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="304" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">orq surface</text>

      <rect x="404" y="472" width="14" height="10" rx="2" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <text x="424" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Provider model</text>

      <line x1="532" y1="478" x2="560" y2="478" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="568" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Allowed</text>

      <line x1="648" y1="478" x2="676" y2="478" stroke="#df5325" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="684" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Refused — wrong kind of credential</text>
    </svg>
  </div>
</body>
</html>
