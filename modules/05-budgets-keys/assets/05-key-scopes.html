<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What a key is allowed to do · Module 05</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Module 05 · Step 1</p>
    <h1>What a key is allowed to do</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="key-scopes-title key-scopes-desc">
      <title id="key-scopes-title">Key scoping: permission mode across project scope</title>
      <desc id="key-scopes-desc">Diagram for module 05 step 1. An API key is scoped on two axes: the permission mode (all, read only, or restricted with a per-domain access map) and the project scope (every project or a single one). A panel records what this workshop observed in September 2026: a key requested as restricted and single-project was stored as all and all, so the budget became the real limit.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Column eyebrows -->
      <text x="196" y="80" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ALL PROJECTS</text>
      <text x="468" y="80" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SINGLE PROJECT</text>

      <!-- Row: PERMISSION_MODE_ALL -->
      <rect x="72" y="96" width="248" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="196" y="130" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">ALL</text>
      <text x="196" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">every domain, every project</text>

      <rect x="344" y="96" width="248" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="468" y="130" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">ALL</text>
      <text x="468" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">every domain, one project</text>

      <!-- Row: READ_ONLY -->
      <rect x="72" y="192" width="248" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="196" y="226" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">READ_ONLY</text>
      <text x="196" y="246" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">reads everything, writes nothing</text>

      <rect x="344" y="192" width="248" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="468" y="226" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">READ_ONLY</text>
      <text x="468" y="246" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">reads one project</text>

      <!-- Row: RESTRICTED -->
      <rect x="72" y="288" width="248" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="196" y="322" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">RESTRICTED</text>
      <text x="196" y="342" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">a per-domain access map</text>

      <rect x="344" y="288" width="248" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="468" y="322" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">RESTRICTED</text>
      <text x="468" y="342" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">access map, one project</text>

      <!-- Panel: what this workshop actually observed -->
      <rect x="632" y="96" width="256" height="272" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="648" y="112" width="128" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="712" y="121" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVED SEPT 2026</text>
      <text x="648" y="150" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif">Asked is not stored</text>

      <text x="648" y="178" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace">asked  : RESTRICTED · single</text>
      <text x="648" y="194" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace">         chat_completions:write</text>
      <text x="648" y="210" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace">         dataset:read eval:read</text>

      <text x="648" y="238" fill="#df5325" font-size="9" font-family="'Kurrent Mono', monospace">stored : permission_mode all</text>
      <text x="648" y="254" fill="#df5325" font-size="9" font-family="'Kurrent Mono', monospace">         project_scope all</text>
      <text x="648" y="270" fill="#df5325" font-size="9" font-family="'Kurrent Mono', monospace">         access null</text>
      <text x="648" y="286" fill="#df5325" font-size="9" font-family="'Kurrent Mono', monospace">family : workspace_jwt</text>

      <text x="648" y="318" fill="#6b6975" font-size="9" font-family="'Kurrent Mono', monospace">the request is accepted,</text>
      <text x="648" y="334" fill="#6b6975" font-size="9" font-family="'Kurrent Mono', monospace">the narrowing is not kept —</text>
      <text x="648" y="350" fill="#6b6975" font-size="9" font-family="'Kurrent Mono', monospace">so the budget is the real limit</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="60" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Widest grant</text>

      <rect x="176" y="472" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="196" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Narrower grant you can request</text>

      <rect x="424" y="472" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="444" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">What this workspace stored — check yours with `orq api-keys list`</text>
    </svg>
  </div>
</body>
</html>
