<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1040" width="1920" height="1040" role="img" aria-labelledby="two-credentials-title two-credentials-desc">
  <title id="two-credentials-title">API key and Management Key: what each one can reach</title>
  <desc id="two-credentials-desc">Architecture diagram for module 05. An API key calls models through the AI Gateway and is scoped by project and permission mode, but it is refused with 403 on the admin endpoints. A Management Key administers API keys and budgets, cannot call models, and cannot delete itself.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="1040" class="bg"/>
  <!-- Arrows first: z-order puts them behind the nodes. -->
  <line x1="536" y1="240" x2="536" y2="400" class="link"/>
  <line x1="536" y1="528" x2="536" y2="688" class="arrow"/>
  <line x1="1384" y1="240" x2="1384" y2="400" class="link"/>
  <!-- The refusal: an API key reaching for the admin surface. -->
  <path d="M 720 240 V 304 Q 720 320 736 320 H 1264 Q 1280 320 1280 336 V 400" class="accent dash"/>
  <!-- Arrow labels: masked, clear of the strokes, on open canvas. -->
  <rect x="552" y="280" width="224" height="24" rx="4" class="mask"/>
  <text x="560" y="298" class="lbl">CHAT / RESPONSES</text>
  <rect x="552" y="584" width="176" height="24" rx="4" class="mask"/>
  <text x="560" y="602" class="lbl">MODEL CALL</text>
  <rect x="1400" y="280" width="184" height="24" rx="4" class="mask"/>
  <text x="1408" y="298" class="lbl">ADMIN CALLS</text>
  <rect x="848" y="264" width="272" height="24" rx="4" class="mask"/>
  <text x="856" y="282" class="lbl t-accent">403 NOT AUTHORIZED</text>
  <!-- Node: API key -->
  <rect x="144" y="112" width="784" height="128" rx="16" class="mask"/>
  <rect x="144" y="112" width="784" height="128" rx="16" class="node"/>
  <rect x="160" y="128" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="188" y="146" text-anchor="middle" class="tag t-ink">KEY</text>
  <text x="536" y="184" text-anchor="middle" class="name">API key</text>
  <text x="536" y="216" text-anchor="middle" class="sub">calls models · scoped by project and permission mode</text>
  <!-- Node: Management Key (focal: the unfamiliar credential) -->
  <rect x="992" y="112" width="784" height="128" rx="16" class="mask"/>
  <rect x="992" y="112" width="784" height="128" rx="16" class="focal"/>
  <rect x="1008" y="128" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="1036" y="146" text-anchor="middle" class="tag t-accent">MGMT</text>
  <text x="1384" y="184" text-anchor="middle" class="name">Management Key</text>
  <text x="1384" y="216" text-anchor="middle" class="sub">administers keys and budgets · cannot call models</text>
  <!-- Node: AI Gateway -->
  <rect x="144" y="400" width="784" height="128" rx="16" class="mask"/>
  <rect x="144" y="400" width="784" height="128" rx="16" class="soft"/>
  <rect x="160" y="416" width="56" height="24" rx="4" class="tag-box"/>
  <text x="188" y="434" text-anchor="middle" class="tag">GW</text>
  <text x="536" y="472" text-anchor="middle" class="name">AI Gateway</text>
  <text x="536" y="504" text-anchor="middle" class="sub">budgets are enforced here, before the provider</text>
  <!-- Node: Admin API -->
  <rect x="992" y="400" width="784" height="128" rx="16" class="mask"/>
  <rect x="992" y="400" width="784" height="128" rx="16" class="soft"/>
  <rect x="1008" y="416" width="56" height="24" rx="4" class="tag-box"/>
  <text x="1036" y="434" text-anchor="middle" class="tag">API</text>
  <text x="1384" y="472" text-anchor="middle" class="name">Admin endpoints</text>
  <text x="1384" y="504" text-anchor="middle" class="sub">/v2/api-keys · /v2/budgets · /v2/management-keys</text>
  <!-- Node: Models -->
  <rect x="144" y="688" width="784" height="96" rx="16" class="mask"/>
  <rect x="144" y="688" width="784" height="96" rx="16" class="ghost"/>
  <rect x="160" y="704" width="56" height="24" rx="4" class="tag-box mute"/>
  <text x="188" y="722" text-anchor="middle" class="tag t-mute">LLM</text>
  <text x="536" y="728" text-anchor="middle" class="name">Models</text>
  <text x="536" y="760" text-anchor="middle" class="sub">the spend a budget is there to cap</text>
  <!-- Editorial aside: the self-delete rule, where it bites in step 5 -->
  <text x="1384" y="600" text-anchor="middle" class="sub t-mute">a Management Key cannot delete itself — the CLI session does that</text>
  <!-- Legend strip -->
  <line x1="80" y1="880" x2="1840" y2="880" class="hair"/>
  <text x="80" y="912" class="legend-title">LEGEND</text>
  <rect x="80" y="944" width="28" height="20" rx="4" class="node"/>
  <text x="120" y="960" class="msg">API key</text>
  <rect x="272" y="944" width="28" height="20" rx="4" class="focal"/>
  <text x="312" y="960" class="msg">Management Key</text>
  <rect x="568" y="944" width="28" height="20" rx="4" class="soft"/>
  <text x="608" y="960" class="msg">orq surface</text>
  <rect x="808" y="944" width="28" height="20" rx="4" class="ghost"/>
  <text x="848" y="960" class="msg">Provider model</text>
  <line x1="1064" y1="956" x2="1120" y2="956" class="link"/>
  <text x="1136" y="960" class="msg">Allowed</text>
  <line x1="1296" y1="956" x2="1352" y2="956" class="accent dash"/>
  <text x="1368" y="960" class="msg">Refused — wrong kind of credential</text>
    
</svg>
