<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding agent wiring · Architecture</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Module 13</p>
    <h1>Three capabilities, one session of traces</h1>

    <svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coding-agent-wiring-title coding-agent-wiring-desc">
      <title id="coding-agent-wiring-title">How orq wires a coding agent: gateway, skills, MCP</title>
      <desc id="coding-agent-wiring-desc">Architecture diagram showing the orq CLI writing gateway, skills and MCP wiring into a coding agent on your machine and linking the bundled skills into its skills directory; the agent then sends model calls to the orq AI Gateway, which records them as traces grouped by session id with cost, and talks to the orq MCP server over OAuth.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Zone: your machine -->
      <rect x="40" y="40" width="440" height="296" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="56" y="44" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="100" y="53" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MACHINE</text>

      <!-- Zone: orq.ai -->
      <rect x="520" y="40" width="416" height="296" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="536" y="44" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="564" y="53" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ORQ.AI</text>

      <!-- Arrows first -->
      <!-- CLI -> agent (wires gateway/skills/mcp) -->
      <line x1="208" y1="120" x2="264" y2="120" stroke="#df5325" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- CLI -> skills dir (links the bundle) -->
      <path d="M 128,160 V 256 Q 128,264 136,264 H 264" fill="none" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- agent -> skills dir (reads) -->
      <line x1="368" y1="160" x2="368" y2="232" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- agent -> gateway (model calls) -->
      <line x1="472" y1="108" x2="544" y2="108" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- agent -> MCP server -->
      <path d="M 472,132 H 492 Q 500,132 500,140 V 256 Q 500,264 508,264 H 544" fill="none" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- gateway -> traces -->
      <line x1="736" y1="120" x2="784" y2="120" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask + 8px gap from the stroke) -->
      <rect x="212" y="100" width="48" height="12" rx="2" fill="#f9f8f6"/>
      <text x="236" y="109" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WIRES</text>

      <rect x="140" y="196" width="60" height="12" rx="2" fill="#f9f8f6"/>
      <text x="144" y="205" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">LINKS 14</text>

      <rect x="380" y="188" width="44" height="12" rx="2" fill="#f9f8f6"/>
      <text x="384" y="197" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">READS</text>

      <rect x="476" y="88" width="64" height="12" rx="2" fill="#f9f8f6"/>
      <text x="508" y="97" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MESSAGES</text>

      <rect x="412" y="212" width="72" height="12" rx="2" fill="#f9f8f6"/>
      <text x="482" y="221" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="end" letter-spacing="0.06em">MCP · OAUTH</text>

      <rect x="740" y="100" width="40" height="12" rx="2" fill="#f9f8f6"/>
      <text x="760" y="109" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COST</text>

      <!-- Node: orq CLI (focal) -->
      <rect x="48" y="80" width="160" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="48" y="80" width="160" height="80" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="56" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="70" y="97" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="128" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">orq launch · connect</text>
      <text x="128" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">gateway · skills · mcp</text>
      <text x="128" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">one session, or on disk</text>

      <!-- Node: coding agent (external tool) -->
      <rect x="264" y="80" width="208" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="264" y="80" width="208" height="80" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="272" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="286" y="97" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="368" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Coding agent</text>
      <text x="368" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">claude · opencode · codex · pi</text>
      <text x="368" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">model calls → /v3/anthropic</text>

      <!-- Node: skills directory (files on disk) -->
      <rect x="264" y="232" width="208" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="264" y="232" width="208" height="64" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="272" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="286" y="249" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="368" y="268" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Skills directory</text>
      <text x="368" y="284" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">symlinks → ~/.orq/snapshot</text>

      <!-- Node: AI Gateway (orq entity) -->
      <rect x="544" y="80" width="192" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="544" y="80" width="192" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="552" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="566" y="97" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="640" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">AI Gateway</text>
      <text x="640" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">/v3/anthropic · /v3/router</text>
      <text x="640" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">budgets · rate limits</text>

      <!-- Node: traces (orq entity) -->
      <rect x="784" y="80" width="136" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="784" y="80" width="136" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="792" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="806" y="97" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
      <text x="852" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Traces</text>
      <text x="852" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">messages.anthropic</text>
      <text x="852" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">session_id · cost</text>

      <!-- Node: orq MCP server (orq entity) -->
      <rect x="544" y="232" width="192" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="544" y="232" width="192" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="552" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="566" y="249" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="640" y="268" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">orq MCP server</text>
      <text x="640" y="284" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">/v2/mcp · orq-workspace</text>

      <!-- Editorial callout (italic aside, dashed leader, landing dot) -->
      <path d="M 852,160 V 196" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="852" cy="160" r="2" fill="#25232e"/>
      <text x="932" y="216" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">A developer session is a client</text>
      <text x="932" y="234" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">like any other: budgeted, traced.</text>

      <!-- Legend strip -->
      <line x1="40" y1="364" x2="920" y2="364" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="380" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="396" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="60" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">orq CLI</text>

      <rect x="140" y="396" width="14" height="10" rx="2" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <text x="160" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Third-party agent</text>

      <rect x="280" y="396" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="300" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Files on disk</text>

      <rect x="400" y="396" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="420" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">orq entity</text>

      <line x1="520" y1="402" x2="548" y2="402" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="556" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">HTTPS call</text>

      <line x1="660" y1="402" x2="688" y2="402" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="696" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Written or read locally</text>

      <line x1="840" y1="402" x2="868" y2="402" stroke="#df5325" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="876" y="404" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Wiring</text>
    </svg>
  </div>
</body>
</html>
