<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP trust chain · Architecture</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Module 10</p>
    <h1>Three entities, one direction of trust</h1>

    <svg viewBox="0 0 960 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-trust-chain-title mcp-trust-chain-desc">
      <title id="mcp-trust-chain-title">MCP trust chain: client, gateway, server, upstream</title>
      <desc id="mcp-trust-chain-desc">Architecture diagram showing an MCP client calling the orq MCP Gateway, which exposes two of the three tools registered on the MCP Server that fronts app/mcp_server.py, while a managed agent attaches to the MCP Server directly.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Zone: orq.ai (gateway, server, agent) -->
      <rect x="240" y="40" width="496" height="280" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="256" y="44" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="284" y="53" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ORQ.AI</text>

      <!-- Zone: your server -->
      <rect x="760" y="40" width="176" height="144" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="776" y="44" width="84" height="12" rx="2" fill="#f9f8f6"/>
      <text x="818" y="53" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR SERVER</text>

      <!-- Arrows first -->
      <line x1="184" y1="120" x2="264" y2="120" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="456" y1="120" x2="536" y2="120" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="712" y1="120" x2="776" y2="120" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="624" y1="232" x2="624" y2="160" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask + 8px gap above the stroke) -->
      <rect x="188" y="100" width="72" height="12" rx="2" fill="#f9f8f6"/>
      <text x="224" y="109" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEARER KEY</text>

      <rect x="464" y="100" width="64" height="12" rx="2" fill="#f9f8f6"/>
      <text x="496" y="109" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL_IDS</text>

      <rect x="720" y="100" width="48" height="12" rx="2" fill="#f9f8f6"/>
      <text x="744" y="109" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <rect x="636" y="188" width="68" height="12" rx="2" fill="#f9f8f6"/>
      <text x="640" y="197" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">TYPE: MCP</text>

      <!-- Node: MCP client (input) -->
      <rect x="40" y="80" width="144" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="40" y="80" width="144" height="80" rx="6" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <rect x="48" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(107,105,117,0.40)" stroke-width="0.8"/>
      <text x="62" y="97" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="112" y="124" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">MCP client</text>
      <text x="112" y="140" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">coding agent · mcp</text>

      <!-- Node: MCP Gateway (focal) -->
      <rect x="264" y="80" width="192" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="264" y="80" width="192" height="80" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="272" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="286" y="97" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="360" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">MCP Gateway</text>
      <text x="360" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">/v3/mcp/ws-refund-gateway</text>
      <text x="360" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">lookup_order · get_policy</text>

      <!-- Node: MCP Server (orq entity, store) -->
      <rect x="536" y="80" width="176" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="536" y="80" width="176" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="544" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="558" y="97" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
      <text x="624" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">MCP Server</text>
      <text x="624" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">ws-refund-mcp · synced</text>
      <text x="624" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">3 tools discovered</text>

      <!-- Node: app/mcp_server.py (your code, backend) -->
      <rect x="776" y="80" width="144" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="776" y="80" width="144" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="784" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="798" y="97" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
      <text x="848" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Upstream server</text>
      <text x="848" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">app/mcp_server.py</text>
      <text x="848" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">3 @server.tool</text>

      <!-- Node: Managed agent (orq entity, store) -->
      <rect x="536" y="232" width="176" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="536" y="232" width="176" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="544" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="558" y="249" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="624" y="268" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Managed agent</text>
      <text x="624" y="284" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">ws-refund-agent-mcp</text>

      <!-- Editorial callout (italic aside, dashed leader, landing dot) -->
      <path d="M 360,160 V 188" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="360" cy="160" r="2" fill="#25232e"/>
      <text x="360" y="208" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="middle">issue_refund is not forbidden,</text>
      <text x="360" y="226" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="middle">it is absent from tools/list.</text>

      <!-- Legend strip -->
      <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="364" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="380" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="60" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Governed endpoint</text>

      <rect x="180" y="380" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="200" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">orq entity</text>

      <rect x="300" y="380" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="320" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Your code</text>

      <rect x="420" y="380" width="14" height="10" rx="2" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <text x="440" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Outside client</text>

      <line x1="560" y1="386" x2="588" y2="386" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="596" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">HTTP call</text>

      <line x1="700" y1="386" x2="728" y2="386" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="736" y="388" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Platform-internal link</text>
    </svg>
  </div>
</body>
</html>
