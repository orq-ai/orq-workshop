<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" role="img" aria-labelledby="delegation-turn-title delegation-turn-desc">
  <title id="delegation-turn-title">Advisor and sidekick inside one agent turn</title>
  <desc id="delegation-turn-desc">Sequence diagram of a refund turn: the app calls the managed agent on gpt-5.6-luna, the agent runs its tools, sends the transcript and a question to the advisor on gpt-5.6-sol and gets advice back, sends only a task to the sidekick on gpt-5.4-nano and gets a closing note back, then answers the app; each secondary call is a nested span with its own cost.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="1200" class="bg"/>
  <!-- Lifelines: App 120 · Agent 360 · Advisor 600 · Sidekick 840 -->
  <line x1="240" y1="192" x2="240" y2="928" class="faint dash"/>
  <line x1="720" y1="192" x2="720" y2="928" class="faint dash"/>
  <line x1="1200" y1="192" x2="1200" y2="928" class="faint dash"/>
  <line x1="1680" y1="192" x2="1680" y2="928" class="faint dash"/>
  <!-- Activation bars -->
  <rect x="712" y="272" width="16" height="616" class="bar"/>
  <rect x="1192" y="464" width="16" height="72" class="bar"/>
  <rect x="1672" y="672" width="16" height="72" class="bar"/>
  <!-- Messages (time flows down) -->
  <!-- M1 App → Agent: responses.create -->
  <line x1="240" y1="272" x2="712" y2="272" class="link"/>
  <!-- M2 Agent self: tools (lookup_order, get_policy, issue_refund -> limit error) -->
  <path d="M 728 352 L 808 352 Q 824 352 824 368 L 824 384 Q 824 400 808 400 L 744 400" class="arrow"/>
  <!-- M3 Agent → Advisor: transcript + question -->
  <line x1="728" y1="464" x2="1192" y2="464" class="arrow"/>
  <!-- M4 Advisor → Agent: advice (return) -->
  <line x1="1192" y1="536" x2="744" y2="536" class="arrow dash"/>
  <!-- M5 Agent → Sidekick: task only (passes behind the advisor lifeline: a hairline, not a box) -->
  <line x1="728" y1="672" x2="1672" y2="672" class="arrow"/>
  <!-- M6 Sidekick → Agent: closing note (return) -->
  <line x1="1672" y1="744" x2="744" y2="744" class="arrow dash"/>
  <!-- M7 Agent → App: message item (headline) -->
  <line x1="712" y1="864" x2="256" y2="864" class="accent"/>
  <!-- Message labels (mask + 6–8px gap above the stroke) -->
  <rect x="392" y="236" width="176" height="24" rx="4" class="mask"/>
  <text x="480" y="254" text-anchor="middle" class="lbl">REFUND ORD_A6</text>
  <rect x="848" y="360" width="256" height="24" rx="4" class="mask"/>
  <text x="856" y="378" class="lbl">TOOLS: OVER LIMIT</text>
  <rect x="816" y="428" width="288" height="24" rx="4" class="mask"/>
  <text x="960" y="446" text-anchor="middle" class="lbl">TRANSCRIPT + QUESTION</text>
  <rect x="904" y="500" width="112" height="24" rx="4" class="mask"/>
  <text x="960" y="518" text-anchor="middle" class="lbl">ADVICE</text>
  <rect x="1352" y="636" width="176" height="24" rx="4" class="mask"/>
  <text x="1440" y="654" text-anchor="middle" class="lbl">TASK ONLY</text>
  <rect x="1352" y="708" width="176" height="24" rx="4" class="mask"/>
  <text x="1440" y="726" text-anchor="middle" class="lbl">CLOSING NOTE</text>
  <rect x="360" y="828" width="240" height="24" rx="4" class="mask"/>
  <text x="480" y="846" text-anchor="middle" class="lbl t-accent">HUMAN REVIEW + NOTE</text>
  <!-- Cost chips on the secondary spans (mono, beside the activation bars) -->
  <rect x="1224" y="488" width="144" height="24" rx="4" class="mask"/>
  <text x="1232" y="506" class="lbl t-accent">$0.0034 76%</text>
  <rect x="1704" y="696" width="144" height="24" rx="4" class="mask"/>
  <text x="1712" y="714" class="lbl">$0.0001  3%</text>
  <rect x="744" y="792" width="176" height="24" rx="4" class="mask"/>
  <text x="752" y="810" class="lbl">AGENT $0.0009 21%</text>
  <!-- Actor: Your app -->
  <rect x="96" y="80" width="288" height="112" rx="16" class="mask"/>
  <rect x="96" y="80" width="288" height="112" rx="16" class="node"/>
  <rect x="112" y="96" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="140" y="114" text-anchor="middle" class="tag t-ink">APP</text>
  <text x="240" y="144" text-anchor="middle" class="name">Your app</text>
  <text x="240" y="174" text-anchor="middle" class="sub">run_agent loop</text>
  <!-- Actor: Agent (focal) -->
  <rect x="560" y="80" width="320" height="112" rx="16" class="mask"/>
  <rect x="560" y="80" width="320" height="112" rx="16" class="focal"/>
  <rect x="576" y="96" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="604" y="114" text-anchor="middle" class="tag t-accent">AGT</text>
  <text x="720" y="144" text-anchor="middle" class="name">Agent decides</text>
  <text x="720" y="174" text-anchor="middle" class="sub">openai/gpt-5.6-luna</text>
  <!-- Actor: Advisor (external model) -->
  <rect x="1056" y="80" width="288" height="112" rx="16" class="mask"/>
  <rect x="1056" y="80" width="288" height="112" rx="16" class="ghost"/>
  <rect x="1072" y="96" width="56" height="24" rx="4" class="tag-box mute"/>
  <text x="1100" y="114" text-anchor="middle" class="tag t-mute">LLM</text>
  <text x="1200" y="144" text-anchor="middle" class="name">Advisor</text>
  <text x="1200" y="174" text-anchor="middle" class="sub">openai/gpt-5.6-sol</text>
  <!-- Actor: Sidekick (external model) -->
  <rect x="1536" y="80" width="288" height="112" rx="16" class="mask"/>
  <rect x="1536" y="80" width="288" height="112" rx="16" class="ghost"/>
  <rect x="1552" y="96" width="56" height="24" rx="4" class="tag-box mute"/>
  <text x="1580" y="114" text-anchor="middle" class="tag t-mute">LLM</text>
  <text x="1680" y="144" text-anchor="middle" class="name">Sidekick</text>
  <text x="1680" y="174" text-anchor="middle" class="sub">openai/gpt-5.4-nano</text>
  <!-- Callouts (italic aside, dashed leader, landing dot on the lifeline end) -->
  <path d="M 464 968 Q 624 960 720 928" class="faint dash"/>
  <circle cx="720" cy="928" r="4" class="dot"/>
  <text x="80" y="1000" class="note">The agent was about to refuse. The advice said</text>
  <text x="80" y="1036" class="note">"human review", and the decision stayed the agent's.</text>
  <path d="M 1456 968 Q 1336 960 1200 928" class="faint dash"/>
  <circle cx="1200" cy="928" r="4" class="dot"/>
  <text x="1840" y="1000" text-anchor="end" class="note">Neither is a sub-agent: one call each, no tools,</text>
  <text x="1840" y="1036" text-anchor="end" class="note">no memory, its own span with its own cost.</text>
  <!-- Legend strip -->
  <line x1="80" y1="1080" x2="1840" y2="1080" class="hair"/>
  <text x="80" y="1112" class="legend-title">LEGEND</text>
  <rect x="80" y="1144" width="28" height="20" rx="4" class="focal"/>
  <text x="120" y="1160" class="msg">Agent on the cheap model (decides every step)</text>
  <line x1="600" y1="1156" x2="656" y2="1156" class="arrow"/>
  <text x="672" y="1160" class="msg">Delegation (server-side tool call)</text>
  <line x1="1024" y1="1156" x2="1080" y2="1156" class="arrow dash"/>
  <text x="1096" y="1160" class="msg">Return (orq:advisor / orq:sidekick item)</text>
  <line x1="1496" y1="1156" x2="1552" y2="1156" class="accent"/>
  <text x="1568" y="1160" class="msg">Final message item</text>
    
</svg>
