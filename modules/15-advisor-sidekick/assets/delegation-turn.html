<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delegation turn · Sequence</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Module 15</p>
    <h1>One turn, three models, one trace</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delegation-turn-title delegation-turn-desc">
      <title id="delegation-turn-title">Advisor and sidekick inside one agent turn</title>
      <desc id="delegation-turn-desc">Sequence diagram of a refund turn: the app calls the managed agent on gpt-5.6-luna, the agent runs its tools, sends the transcript and a question to the advisor on gpt-5.6-sol and gets advice back, sends only a task to the sidekick on gpt-5.4-nano and gets a closing note back, then answers the app; each secondary call is a nested span with its own cost.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Lifelines: App 120 · Agent 360 · Advisor 600 · Sidekick 840 -->
      <line x1="120" y1="96" x2="120" y2="464" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="96" x2="360" y2="464" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="96" x2="600" y2="464" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="96" x2="840" y2="464" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="356" y="136" width="8" height="308" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>
      <rect x="596" y="232" width="8" height="36" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>
      <rect x="836" y="336" width="8" height="36" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>

      <!-- Messages (time flows down) -->
      <!-- M1 App → Agent: responses.create -->
      <line x1="120" y1="136" x2="356" y2="136" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 Agent self: tools (lookup_order, get_policy, issue_refund -> limit error) -->
      <path d="M 364,176 L 404,176 Q 412,176 412,184 L 412,192 Q 412,200 404,200 L 372,200" fill="none" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 Agent → Advisor: transcript + question -->
      <line x1="364" y1="232" x2="596" y2="232" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 Advisor → Agent: advice (return) -->
      <line x1="596" y1="268" x2="372" y2="268" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M5 Agent → Sidekick: task only (passes behind the advisor lifeline: a hairline, not a box) -->
      <line x1="364" y1="336" x2="836" y2="336" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 Sidekick → Agent: closing note (return) -->
      <line x1="836" y1="372" x2="372" y2="372" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M7 Agent → App: message item (headline) -->
      <line x1="356" y1="432" x2="128" y2="432" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Message labels (mask + 6–8px gap above the stroke) -->
      <rect x="196" y="118" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="240" y="127" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFUND ORD_A6</text>

      <rect x="424" y="180" width="128" height="12" rx="2" fill="#f9f8f6"/>
      <text x="428" y="189" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">TOOLS: OVER LIMIT</text>

      <rect x="408" y="214" width="144" height="12" rx="2" fill="#f9f8f6"/>
      <text x="480" y="223" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSCRIPT + QUESTION</text>

      <rect x="452" y="250" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="480" y="259" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADVICE</text>

      <rect x="676" y="318" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="327" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TASK ONLY</text>

      <rect x="676" y="354" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="363" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLOSING NOTE</text>

      <rect x="180" y="414" width="120" height="12" rx="2" fill="#f9f8f6"/>
      <text x="240" y="423" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HUMAN REVIEW + NOTE</text>

      <!-- Cost chips on the secondary spans (mono, beside the activation bars) -->
      <rect x="612" y="244" width="72" height="12" rx="2" fill="#f9f8f6"/>
      <text x="616" y="253" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">$0.0034 76%</text>
      <rect x="852" y="348" width="72" height="12" rx="2" fill="#f9f8f6"/>
      <text x="856" y="357" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">$0.0001  3%</text>
      <rect x="372" y="396" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="376" y="405" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">AGENT $0.0009 21%</text>

      <!-- Actor: Your app -->
      <rect x="48" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="48" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="56" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="70" y="57" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="120" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Your app</text>
      <text x="120" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">run_agent loop</text>

      <!-- Actor: Agent (focal) -->
      <rect x="280" y="40" width="160" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="280" y="40" width="160" height="56" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="288" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="302" y="57" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="360" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Agent decides</text>
      <text x="360" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">openai/gpt-5.6-luna</text>

      <!-- Actor: Advisor (external model) -->
      <rect x="528" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="528" y="40" width="144" height="56" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="536" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="550" y="57" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="600" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Advisor</text>
      <text x="600" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">openai/gpt-5.6-sol</text>

      <!-- Actor: Sidekick (external model) -->
      <rect x="768" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="768" y="40" width="144" height="56" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="776" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="790" y="57" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="840" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Sidekick</text>
      <text x="840" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">openai/gpt-5.4-nano</text>

      <!-- Callouts (italic aside, dashed leader, landing dot on the lifeline end) -->
      <path d="M 232,484 Q 312,480 360,464" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="360" cy="464" r="2" fill="#25232e"/>
      <text x="40" y="500" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif">The agent was about to refuse. The advice said</text>
      <text x="40" y="518" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif">"human review", and the decision stayed the agent's.</text>

      <path d="M 728,484 Q 668,480 600,464" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="600" cy="464" r="2" fill="#25232e"/>
      <text x="920" y="500" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">Neither is a sub-agent: one call each, no tools,</text>
      <text x="920" y="518" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">no memory, its own span with its own cost.</text>

      <!-- Legend strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="572" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="60" y="580" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Agent on the cheap model (decides every step)</text>

      <line x1="300" y1="578" x2="328" y2="578" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="336" y="580" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Delegation (server-side tool call)</text>

      <line x1="512" y1="578" x2="540" y2="578" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="548" y="580" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Return (orq:advisor / orq:sidekick item)</text>

      <line x1="748" y1="578" x2="776" y2="578" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="784" y="580" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Final message item</text>
    </svg>
  </div>
</body>
</html>
