<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responses tool loop · Sequence</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Module 08</p>
    <h1>A managed agent does not run your Python</h1>

    <svg viewBox="0 0 960 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="responses-tool-loop-title responses-tool-loop-desc">
      <title id="responses-tool-loop-title">Responses API tool loop with a managed agent</title>
      <desc id="responses-tool-loop-desc">Sequence diagram showing your app calling a managed agent through the Responses API, receiving a function_call item, executing the tool locally, sending function_call_output with previous_response_id, and looping until a message item with a trace id comes back.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Lifelines: Tools 120 · App 336 · Agent 600 · Model 840 -->
      <line x1="120" y1="96" x2="120" y2="500" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="336" y1="96" x2="336" y2="500" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="96" x2="600" y2="500" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="96" x2="840" y2="500" stroke="rgba(37,35,46,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Loop fragment frame (spans all four lifelines) -->
      <rect x="108" y="256" width="744" height="192" rx="4" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.22)" stroke-width="1"/>
      <rect x="108" y="256" width="40" height="16" rx="2" fill="#f9f8f6" stroke="rgba(37,35,46,0.22)" stroke-width="1"/>
      <text x="128" y="268" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <rect x="152" y="270" width="196" height="14" rx="2" fill="#f9f8f6"/>
      <text x="156" y="280" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.04em">[while output has function_call]</text>

      <!-- Activation bars -->
      <rect x="596" y="136" width="8" height="96" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>
      <rect x="116" y="304" width="8" height="28" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>
      <rect x="596" y="368" width="8" height="116" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>

      <!-- Messages (time flows down) -->
      <!-- M1 App → Agent: responses.create(input=...) -->
      <line x1="336" y1="136" x2="596" y2="136" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 Agent → Model -->
      <line x1="604" y1="168" x2="840" y2="168" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 Model → Agent (return) -->
      <line x1="840" y1="200" x2="604" y2="200" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M4 Agent → App (return: status completed, function_call item) -->
      <line x1="596" y1="232" x2="336" y2="232" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M5 App → Tools: dispatch(name, args) -->
      <line x1="336" y1="304" x2="124" y2="304" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 Tools → App (return dict) -->
      <line x1="124" y1="332" x2="336" y2="332" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M7 App → Agent: responses.create(previous_response_id, function_call_output) -->
      <line x1="336" y1="368" x2="596" y2="368" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M8 Agent → Model -->
      <line x1="604" y1="400" x2="840" y2="400" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M9 Model → Agent (return) -->
      <line x1="840" y1="428" x2="604" y2="428" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M10 Agent → App: message item (headline success) -->
      <line x1="596" y1="484" x2="336" y2="484" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Message labels (mask + 6–8px gap above the stroke) -->
      <rect x="424" y="118" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="468" y="127" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE INPUT</text>

      <rect x="688" y="150" width="64" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="159" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN MODEL</text>

      <rect x="676" y="182" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="191" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FUNCTION_CALL</text>

      <rect x="420" y="214" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="468" y="223" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ITEM + CALL_ID</text>

      <rect x="180" y="286" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="228" y="295" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH(NAME)</text>

      <rect x="188" y="314" width="80" height="12" rx="2" fill="#f9f8f6"/>
      <text x="228" y="323" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT DICT</text>

      <rect x="420" y="350" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="468" y="359" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FN_CALL_OUTPUT</text>
      <rect x="424" y="374" width="88" height="12" rx="2" fill="#f9f8f6"/>
      <text x="468" y="383" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">+ PREVIOUS_ID</text>

      <rect x="692" y="382" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="391" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTINUE</text>

      <rect x="688" y="410" width="64" height="12" rx="2" fill="#f9f8f6"/>
      <text x="720" y="419" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ITEM</text>

      <rect x="420" y="466" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="468" y="475" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MSG + TRACE_ID</text>

      <!-- Actor: Your tools (local, store) -->
      <rect x="48" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="48" y="40" width="144" height="56" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="56" y="48" width="36" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="74" y="57" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
      <text x="120" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Your tools</text>
      <text x="120" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">tools.dispatch</text>

      <!-- Actor: Your app (backend) -->
      <rect x="264" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="264" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="272" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="286" y="57" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="336" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Your app</text>
      <text x="336" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">run_agent loop</text>

      <!-- Actor: Managed agent (focal) -->
      <rect x="520" y="40" width="160" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="520" y="40" width="160" height="56" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="528" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="542" y="57" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="600" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Managed agent</text>
      <text x="600" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">agent/ws-refund-agent</text>

      <!-- Actor: Model (external) -->
      <rect x="768" y="40" width="144" height="56" rx="6" fill="#f9f8f6"/>
      <rect x="768" y="40" width="144" height="56" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="776" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="790" y="57" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="840" y="72" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Model</text>
      <text x="840" y="87" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">openai/gpt-4o-mini</text>

      <!-- Callouts (italic aside, dashed leader, landing dot on the lifeline end) -->
      <path d="M 232,516 Q 292,512 336,500" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="336" cy="500" r="2" fill="#25232e"/>
      <text x="40" y="532" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif">Match on call_id, not id. Answer only the</text>
      <text x="40" y="550" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif">function_call items that name one of your tools.</text>

      <path d="M 712,516 Q 652,512 600,500" fill="none" stroke="rgba(37,35,46,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="600" cy="500" r="2" fill="#25232e"/>
      <text x="920" y="532" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">Server tools (memory, advisor) also emit function_call,</text>
      <text x="920" y="550" fill="#25232e" font-size="14" font-style="italic" font-family="'Avio Sans', sans-serif" text-anchor="end">then an orq:&lt;tool&gt; item with the result. Not yours to answer.</text>

      <!-- Legend strip -->
      <line x1="40" y1="572" x2="920" y2="572" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="604" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="60" y="612" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Managed agent (state lives here)</text>

      <rect x="236" y="600" width="4" height="18" fill="rgba(37,35,46,0.06)" stroke="#025558" stroke-width="0.8"/>
      <text x="248" y="612" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Holds control</text>

      <line x1="344" y1="610" x2="372" y2="610" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="380" y="612" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">responses.create (one trace each)</text>

      <line x1="560" y1="610" x2="588" y2="610" stroke="#025558" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="596" y="612" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Return</text>

      <line x1="664" y1="610" x2="692" y2="610" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="700" y="612" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Final message item + telemetry.trace_id</text>
    </svg>
  </div>
</body>
</html>
