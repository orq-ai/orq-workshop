<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Span ownership · Swimlane</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Module 02</p>
    <h1>Who produces which span</h1>

    <svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="span-ownership-title span-ownership-desc">
      <title id="span-ownership-title">Span ownership: your app versus the AI Gateway</title>
      <desc id="span-ownership-desc">Swimlane diagram showing the app's @traced root span refund_turn and its tool spans in one lane, the gateway's chat.openai trace and span.chat_completion in the other, joined by the traceparent header, with request body fields becoming filters in the Traces view.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Lane A: your app -->
      <rect x="40" y="40" width="880" height="144" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="56" y="44" width="272" height="12" rx="2" fill="#f9f8f6"/>
      <text x="192" y="53" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR APP · @TRACED · OTLP TO /V2/OTEL</text>

      <!-- Lane B: AI Gateway -->
      <rect x="40" y="200" width="880" height="152" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="440" y="204" width="280" height="12" rx="2" fill="#f9f8f6"/>
      <text x="580" y="213" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AI GATEWAY · /V3/ROUTER · ONE TRACE PER CALL</text>

      <!-- Arrows first -->
      <!-- request fields ride on the call: down from N1, into N4 from the left -->
      <path d="M 152,160 V 280 Q 152,288 160,288 H 304" fill="none" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- traceparent: root span -> gateway trace (focal) -->
      <line x1="376" y1="160" x2="376" y2="248" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- root -> tool spans -->
      <line x1="464" y1="120" x2="528" y2="120" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- chat.openai -> span.chat_completion -->
      <line x1="448" y1="288" x2="496" y2="288" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- fields become filters (passive) -->
      <line x1="664" y1="288" x2="712" y2="288" stroke="#025558" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="164" y="236" width="80" height="12" rx="2" fill="#f9f8f6"/>
      <text x="168" y="245" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">BODY FIELDS</text>

      <rect x="388" y="188" width="84" height="12" rx="2" fill="#f9f8f6"/>
      <text x="392" y="197" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">TRACEPARENT</text>

      <rect x="476" y="100" width="40" height="12" rx="2" fill="#f9f8f6"/>
      <text x="496" y="109" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHILD</text>

      <rect x="452" y="268" width="40" height="12" rx="2" fill="#f9f8f6"/>
      <text x="472" y="277" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHILD</text>

      <rect x="668" y="268" width="40" height="12" rx="2" fill="#f9f8f6"/>
      <text x="688" y="277" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <!-- N1: Request fields (input) -->
      <rect x="64" y="80" width="176" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="64" y="80" width="176" height="80" rx="6" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <rect x="72" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(107,105,117,0.40)" stroke-width="0.8"/>
      <text x="88" y="97" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BODY</text>
      <text x="152" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Request fields</text>
      <text x="152" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">name · identity · thread</text>
      <text x="152" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">metadata · via extra_body</text>

      <!-- N2: refund_turn root span (your code) -->
      <rect x="304" y="80" width="160" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="304" y="80" width="160" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="312" y="88" width="36" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="330" y="97" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="384" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">refund_turn</text>
      <text x="384" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">@traced(type="agent")</text>
      <text x="384" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">root span · one per turn</text>

      <!-- N3: tool spans (your code) -->
      <rect x="528" y="80" width="264" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="528" y="80" width="264" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="536" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="552" y="97" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
      <text x="660" y="120" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">tool spans ×3</text>
      <text x="660" y="136" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">@traced(type="tool")</text>
      <text x="660" y="150" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">lookup_order · get_policy · issue_refund</text>

      <!-- N4: chat.openai trace (gateway) -->
      <rect x="304" y="248" width="144" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="304" y="248" width="144" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="312" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="330" y="265" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRACE</text>
      <text x="376" y="288" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">chat.openai ×4</text>
      <text x="376" y="304" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">one per model call</text>
      <text x="376" y="318" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">nested under root</text>

      <!-- N5: span.chat_completion (gateway) -->
      <rect x="496" y="248" width="168" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="496" y="248" width="168" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="504" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="520" y="265" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPAN</text>
      <text x="580" y="288" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">span.chat_completion</text>
      <text x="580" y="304" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">model · cost · tokens</text>
      <text x="580" y="318" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">latency · status</text>

      <!-- N6: Traces view (external) -->
      <rect x="712" y="248" width="200" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="712" y="248" width="200" height="80" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="720" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="736" y="265" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="812" y="288" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Traces · CLI filters</text>
      <text x="812" y="304" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">thread_id · identity_id</text>
      <text x="812" y="318" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">metadata.* · name</text>

      <!-- Legend strip -->
      <line x1="40" y1="368" x2="920" y2="368" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="384" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="400" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="60" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Span your code emits</text>

      <rect x="196" y="400" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="216" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Span the gateway emits</text>

      <rect x="364" y="400" width="14" height="10" rx="2" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <text x="384" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Request body</text>

      <rect x="480" y="400" width="14" height="10" rx="2" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <text x="500" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Studio / CLI</text>

      <line x1="592" y1="406" x2="620" y2="406" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="628" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">W3C traceparent header</text>

      <line x1="764" y1="406" x2="792" y2="406" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="800" y="408" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">HTTP call</text>
    </svg>
  </div>
</body>
</html>
