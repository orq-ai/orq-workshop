<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guarded request path · Process</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../../docs/stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../../docs/stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Module 04</p>
    <h1>One request, three controls, one exit for humans</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guarded-request-title guarded-request-desc">
      <title id="guarded-request-title">The guarded request path through the orq gateway</title>
      <desc id="guarded-request-desc">Process diagram showing a refund app request passing through PII redaction and input guardrails in the orq gateway, reaching the provider with placeholders only, then an output guardrail that either lets PII restore return the answer or blocks with HTTP 400 and hands the case to a human.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Zone: orq AI Gateway (plugin, guardrails, restore) -->
      <rect x="216" y="24" width="560" height="272" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <rect x="232" y="28" width="104" height="12" rx="2" fill="#f9f8f6"/>
      <text x="284" y="37" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ORQ AI GATEWAY</text>

      <!-- Arrows first: request path (row 1), response path (row 2), block path (down) -->
      <line x1="160" y1="96" x2="232" y2="96" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="376" y1="96" x2="448" y2="96" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="96" x2="808" y2="96" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 864,136 V 232 Q 864,240 856,240 H 752" fill="none" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="616" y1="240" x2="376" y2="240" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 232,240 H 108 Q 100,240 100,232 V 136" fill="none" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="684" y1="280" x2="684" y2="328" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels (opaque mask, 8px clear of the stroke) -->
      <rect x="168" y="76" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="196" y="85" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

      <rect x="384" y="76" width="56" height="12" rx="2" fill="#f9f8f6"/>
      <text x="412" y="85" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDACTED</text>

      <rect x="672" y="76" width="80" height="12" rx="2" fill="#f9f8f6"/>
      <text x="712" y="85" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLACEHOLDERS</text>

      <rect x="872" y="176" width="64" height="12" rx="2" fill="#f9f8f6"/>
      <text x="876" y="185" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">RESPONSE</text>

      <rect x="472" y="220" width="48" height="12" rx="2" fill="#f9f8f6"/>
      <text x="496" y="229" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASSED</text>

      <rect x="108" y="176" width="52" height="12" rx="2" fill="#f9f8f6"/>
      <text x="112" y="185" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">ANSWER</text>

      <rect x="692" y="296" width="60" height="12" rx="2" fill="#f9f8f6"/>
      <text x="696" y="305" fill="#df5325" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">HTTP 400</text>

      <!-- Node: Refund app (input) -->
      <rect x="40" y="56" width="120" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="40" y="56" width="120" height="80" rx="6" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <rect x="48" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(107,105,117,0.40)" stroke-width="0.8"/>
      <text x="62" y="73" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="100" y="100" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Refund app</text>
      <text x="100" y="116" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">chat.completions</text>
      <text x="100" y="128" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">+ extra_body</text>

      <!-- Node: PII redaction plugin (rewrites) -->
      <rect x="232" y="56" width="144" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="232" y="56" width="144" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="240" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="254" y="73" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLG</text>
      <text x="304" y="100" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">PII redaction</text>
      <text x="304" y="116" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">plugin · rewrites</text>
      <text x="304" y="128" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">pii.redact span</text>

      <!-- Node: Input guardrails (judges) -->
      <rect x="448" y="56" width="168" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="448" y="56" width="168" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="456" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="470" y="73" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRD</text>
      <text x="532" y="100" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Input guardrails</text>
      <text x="532" y="116" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">secret · pii · CEL rule</text>
      <text x="532" y="128" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">judge · never rewrite</text>

      <!-- Node: Provider (external) -->
      <rect x="808" y="56" width="112" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="808" y="56" width="112" height="80" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="816" y="64" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="830" y="73" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="864" y="100" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Provider</text>
      <text x="864" y="116" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">sees placeholders</text>
      <text x="864" y="128" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">never the email</text>

      <!-- Node: Output guardrail (judges) -->
      <rect x="616" y="200" width="136" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="616" y="200" width="136" height="80" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="624" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="638" y="217" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRD</text>
      <text x="684" y="244" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Output guardrail</text>
      <text x="684" y="260" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">ws-refund-limit-guard</text>
      <text x="684" y="272" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">span.evaluator</text>

      <!-- Node: PII restore (rewrites) -->
      <rect x="232" y="200" width="144" height="80" rx="6" fill="#f9f8f6"/>
      <rect x="232" y="200" width="144" height="80" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="240" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="254" y="217" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLG</text>
      <text x="304" y="244" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">PII restore</text>
      <text x="304" y="260" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">originals back</text>
      <text x="304" y="272" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">pii.restore span</text>

      <!-- Node: Human hand-off (focal, Factor 7) -->
      <rect x="616" y="328" width="136" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="616" y="328" width="136" height="64" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="624" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="638" y="345" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">F7</text>
      <text x="684" y="364" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Human hand-off</text>
      <text x="684" y="380" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">except branch · ticket</text>

      <!-- Legend strip -->
      <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="440" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="60" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Plugin: rewrites</text>

      <rect x="164" y="456" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="184" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Guardrail: judges, pass or block</text>

      <rect x="360" y="456" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="380" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Escalation path</text>

      <rect x="480" y="456" width="14" height="10" rx="2" fill="rgba(2,85,88,0.10)" stroke="#6b6975" stroke-width="1"/>
      <text x="500" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Your app</text>

      <rect x="572" y="456" width="14" height="10" rx="2" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <text x="592" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Provider</text>

      <line x1="664" y1="462" x2="692" y2="462" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="700" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">HTTP hop</text>

      <line x1="780" y1="462" x2="808" y2="462" stroke="#df5325" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="816" y="464" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Block, 400</text>
    </svg>
  </div>
</body>
</html>
