<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1040" width="1920" height="1040" role="img" aria-labelledby="where-retrieval-runs-title where-retrieval-runs-desc">
  <title id="where-retrieval-runs-title">Where retrieval runs: in code, in the gateway, in the agent</title>
  <desc id="where-retrieval-runs-desc">Architecture diagram showing one knowledge base searched three ways: your code pre-fetches chunks into a system message before a gateway chat call, the gateway can be asked to inject knowledge on a plain chat call (documented but not verified here), and a managed agent searches it through server-side tools before calling the model.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="1040" class="bg"/>
  <!-- Column eyebrows -->
  <text x="240" y="256" class="zone-title">A · PRE-FETCH IN CODE (FACTOR 13)</text>
  <text x="864" y="256" class="zone-title">B · GATEWAY-SIDE</text>
  <text x="1488" y="256" class="zone-title">C · MANAGED AGENT</text>
  <!-- Arrows first -->
  <!-- A: code searches the KB (up), then chats through the gateway (down), gateway calls the model -->
  <line x1="208" y1="272" x2="208" y2="176" class="link"/>
  <line x1="336" y1="400" x2="336" y2="496" class="link"/>
  <line x1="336" y1="624" x2="336" y2="752" class="arrow"/>
  <!-- B: plain chat with extra_body, gateway asked to inject knowledge (dashed, not verified), gateway calls the model -->
  <line x1="960" y1="400" x2="960" y2="496" class="link"/>
  <line x1="648" y1="496" x2="648" y2="176" class="arrow dash"/>
  <line x1="960" y1="624" x2="960" y2="752" class="arrow"/>
  <!-- C: code invokes the agent, the agent queries the KB through server tools, then calls the model -->
  <line x1="1584" y1="400" x2="1584" y2="496" class="link"/>
  <path d="M 1392 560 H 1288 Q 1272 560 1272 544 V 176" class="arrow"/>
  <line x1="1584" y1="624" x2="1584" y2="752" class="arrow"/>
  <!-- Arrow labels (beside vertical segments, 8px gap) -->
  <rect x="224" y="208" width="136" height="24" rx="4" class="mask"/>
  <text x="232" y="226" class="lbl">KB.SEARCH</text>
  <rect x="352" y="432" width="192" height="24" rx="4" class="mask"/>
  <text x="360" y="450" class="lbl">CHAT + CONTEXT</text>
  <rect x="352" y="672" width="192" height="24" rx="4" class="mask"/>
  <text x="360" y="690" class="lbl">592 PROMPT TOK</text>
  <rect x="976" y="432" width="192" height="24" rx="4" class="mask"/>
  <text x="984" y="450" class="lbl">CHAT + BODY</text>
  <rect x="664" y="424" width="152" height="24" rx="4" class="mask"/>
  <text x="672" y="442" class="lbl">KB IN BODY</text>
  <rect x="664" y="456" width="168" height="24" rx="4" class="mask"/>
  <text x="672" y="474" class="lbl t-mute">NOT VERIFIED</text>
  <rect x="976" y="672" width="184" height="24" rx="4" class="mask"/>
  <text x="984" y="690" class="lbl">26 PROMPT TOK</text>
  <rect x="1600" y="432" width="160" height="24" rx="4" class="mask"/>
  <text x="1608" y="450" class="lbl">RESPONSES</text>
  <rect x="1288" y="424" width="120" height="24" rx="4" class="mask"/>
  <text x="1296" y="442" class="lbl">QUERY_KB</text>
  <rect x="1288" y="456" width="152" height="24" rx="4" class="mask"/>
  <text x="1296" y="474" class="lbl">SERVER TOOL</text>
  <rect x="1600" y="672" width="200" height="24" rx="4" class="mask"/>
  <text x="1608" y="690" class="lbl">3662 PROMPT TOK</text>
  <!-- Node: Knowledge base (focal hub, top bar) -->
  <rect x="144" y="80" width="1632" height="96" rx="16" class="mask"/>
  <rect x="144" y="80" width="1632" height="96" rx="16" class="focal"/>
  <rect x="160" y="96" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="188" y="114" text-anchor="middle" class="tag t-accent">KB</text>
  <text x="960" y="120" text-anchor="middle" class="name">Knowledge base</text>
  <text x="960" y="152" text-anchor="middle" class="sub">ws-refund-policy-large · chunks · embeddings · hybrid search + rerank</text>
  <!-- Node: Your code (A) -->
  <rect x="144" y="272" width="384" height="128" rx="16" class="mask"/>
  <rect x="144" y="272" width="384" height="128" rx="16" class="node"/>
  <rect x="160" y="288" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="188" y="306" text-anchor="middle" class="tag t-ink">APP</text>
  <text x="336" y="344" text-anchor="middle" class="name">Your code</text>
  <text x="336" y="376" text-anchor="middle" class="sub">search → system message</text>
  <!-- Node: Your code (B) -->
  <rect x="768" y="272" width="384" height="128" rx="16" class="mask"/>
  <rect x="768" y="272" width="384" height="128" rx="16" class="node"/>
  <rect x="784" y="288" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="812" y="306" text-anchor="middle" class="tag t-ink">APP</text>
  <text x="960" y="344" text-anchor="middle" class="name">Your code</text>
  <text x="960" y="376" text-anchor="middle" class="sub">extra_body.orq.knowledge_bases</text>
  <!-- Node: Your code (C) -->
  <rect x="1392" y="272" width="384" height="128" rx="16" class="mask"/>
  <rect x="1392" y="272" width="384" height="128" rx="16" class="node"/>
  <rect x="1408" y="288" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="1436" y="306" text-anchor="middle" class="tag t-ink">APP</text>
  <text x="1584" y="344" text-anchor="middle" class="name">Your code</text>
  <text x="1584" y="376" text-anchor="middle" class="sub">model=agent/ws-refund-agent-rag</text>
  <!-- Node: AI Gateway (orq entity, spans columns A and B) -->
  <rect x="144" y="496" width="1008" height="128" rx="16" class="mask"/>
  <rect x="144" y="496" width="1008" height="128" rx="16" class="soft"/>
  <rect x="160" y="512" width="56" height="24" rx="4" class="tag-box"/>
  <text x="188" y="530" text-anchor="middle" class="tag">GW</text>
  <text x="648" y="568" text-anchor="middle" class="name">AI Gateway</text>
  <text x="648" y="600" text-anchor="middle" class="sub">/v3/router/responses · traces the model call only</text>
  <!-- Node: Managed agent (orq entity) -->
  <rect x="1392" y="496" width="384" height="128" rx="16" class="mask"/>
  <rect x="1392" y="496" width="384" height="128" rx="16" class="soft"/>
  <rect x="1408" y="512" width="56" height="24" rx="4" class="tag-box"/>
  <text x="1436" y="530" text-anchor="middle" class="tag">AGT</text>
  <text x="1584" y="568" text-anchor="middle" class="name">Managed agent</text>
  <text x="1584" y="600" text-anchor="middle" class="sub">retrieval in the trace</text>
  <!-- Node: Model (external, bottom bar) -->
  <rect x="144" y="752" width="1632" height="96" rx="16" class="mask"/>
  <rect x="144" y="752" width="1632" height="96" rx="16" class="ghost"/>
  <rect x="160" y="768" width="56" height="24" rx="4" class="tag-box mute"/>
  <text x="188" y="786" text-anchor="middle" class="tag t-mute">LLM</text>
  <text x="960" y="792" text-anchor="middle" class="name">Model</text>
  <text x="960" y="824" text-anchor="middle" class="sub">openai/gpt-5.6-luna · what it sees is what the prompt tokens say</text>
  <!-- Legend strip -->
  <line x1="80" y1="920" x2="1840" y2="920" class="hair"/>
  <text x="80" y="952" class="legend-title">LEGEND</text>
  <rect x="80" y="984" width="28" height="20" rx="4" class="focal"/>
  <text x="120" y="1000" class="msg">Shared knowledge base</text>
  <rect x="392" y="984" width="28" height="20" rx="4" class="node"/>
  <text x="432" y="1000" class="msg">Your code</text>
  <rect x="608" y="984" width="28" height="20" rx="4" class="soft"/>
  <text x="648" y="1000" class="msg">orq entity</text>
  <rect x="824" y="984" width="28" height="20" rx="4" class="ghost"/>
  <text x="864" y="1000" class="msg">Provider model</text>
  <line x1="1080" y1="996" x2="1136" y2="996" class="link"/>
  <text x="1152" y="1000" class="msg">API call from your code</text>
  <line x1="1432" y1="996" x2="1488" y2="996" class="arrow dash"/>
  <text x="1504" y="1000" class="msg">Documented, injected nothing here</text>
    
</svg>
