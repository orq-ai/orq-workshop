<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 880" width="1920" height="880" role="img" aria-labelledby="s11-step2-title s11-step2-desc">
  <title id="s11-step2-title">Generating personas and scenarios from a one-line agent description</title>
  <desc id="s11-step2-desc">Flow showing a one-line description of the refund agent passed to generate_and_simulate, which writes three personas and one scenario. The generated scenario asks for an in-window refund of defective EchoBuds earbuds but binds to fixture order ord_a3, which is really a cable organiser set delivered 45 days ago, so the agent correctly refuses and all three conversations score zero. The personas are reusable; the scenario has to be fixed by hand and replayed.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="880" class="bg"/>
  <!-- Arrows first -->
  <line x1="496" y1="280" x2="576" y2="280" class="arrow"/>
  <line x1="976" y1="280" x2="1056" y2="280" class="arrow"/>
  <line x1="1472" y1="280" x2="1552" y2="280" class="arrow"/>
  <!-- generated scenario down to the fixture it collided with -->
  <line x1="1264" y1="376" x2="1264" y2="496" class="accent dash"/>
  <!-- simulate down to the verdict -->
  <line x1="1696" y1="376" x2="1696" y2="496" class="arrow"/>
  <!-- Arrow labels -->
  <rect x="488" y="224" width="96" height="24" rx="4" class="mask"/>
  <text x="536" y="242" text-anchor="middle" class="lbl">1 LINE</text>
  <rect x="960" y="224" width="112" height="24" rx="4" class="mask"/>
  <text x="1016" y="242" text-anchor="middle" class="lbl">3 × 1</text>
  <rect x="1456" y="224" width="112" height="24" rx="4" class="mask"/>
  <text x="1512" y="242" text-anchor="middle" class="lbl">REPLAY</text>
  <rect x="1288" y="412" width="128" height="24" rx="4" class="mask"/>
  <text x="1296" y="430" class="lbl t-accent">MISMATCH</text>
  <!-- Node: agent description (input) -->
  <rect x="80" y="192" width="416" height="176" rx="16" class="mask"/>
  <rect x="80" y="192" width="416" height="176" rx="16" class="alt"/>
  <rect x="96" y="208" width="56" height="24" rx="4" class="tag-box mute"/>
  <text x="124" y="226" text-anchor="middle" class="tag t-mute">TXT</text>
  <text x="288" y="272" text-anchor="middle" class="name">Agent description</text>
  <text x="288" y="304" text-anchor="middle" class="sub">one sentence, hand written</text>
  <text x="288" y="336" text-anchor="middle" class="sub">&quot;refunds within 30 days&quot;</text>
  <!-- Node: generator -->
  <rect x="576" y="192" width="400" height="176" rx="16" class="mask"/>
  <rect x="576" y="192" width="400" height="176" rx="16" class="node"/>
  <rect x="592" y="208" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="620" y="226" text-anchor="middle" class="tag t-ink">LLM</text>
  <text x="776" y="272" text-anchor="middle" class="name">generate_and_simulate</text>
  <text x="776" y="304" text-anchor="middle" class="sub">num_personas=3</text>
  <text x="776" y="336" text-anchor="middle" class="sub">num_scenarios=1</text>
  <!-- Node: generated cases (focal) -->
  <rect x="1056" y="192" width="416" height="176" rx="16" class="mask"/>
  <rect x="1056" y="192" width="416" height="176" rx="16" class="focal"/>
  <rect x="1072" y="208" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="1100" y="226" text-anchor="middle" class="tag t-accent">GEN</text>
  <text x="1264" y="272" text-anchor="middle" class="name">Generated cases</text>
  <text x="1264" y="304" text-anchor="middle" class="sub">3 personas · reusable</text>
  <text x="1264" y="336" text-anchor="middle" class="sub">1 scenario · &quot;defective EchoBuds&quot;</text>
  <!-- Node: simulate -->
  <rect x="1552" y="192" width="288" height="176" rx="16" class="mask"/>
  <rect x="1552" y="192" width="288" height="176" rx="16" class="node"/>
  <rect x="1568" y="208" width="56" height="24" rx="4" class="tag-box ink"/>
  <text x="1596" y="226" text-anchor="middle" class="tag t-ink">TGT</text>
  <text x="1696" y="280" text-anchor="middle" class="name">Local agent</text>
  <text x="1696" y="320" text-anchor="middle" class="sub">max_turns=3</text>
  <!-- Node: the fixture the scenario collided with -->
  <rect x="1056" y="496" width="416" height="176" rx="16" class="mask"/>
  <rect x="1056" y="496" width="416" height="176" rx="16" class="soft"/>
  <rect x="1072" y="512" width="56" height="24" rx="4" class="tag-box"/>
  <text x="1100" y="530" text-anchor="middle" class="tag">DB</text>
  <text x="1264" y="576" text-anchor="middle" class="name">What ord_a3 really is</text>
  <text x="1264" y="608" text-anchor="middle" class="sub">cable organiser set, EUR 42.50</text>
  <text x="1264" y="640" text-anchor="middle" class="sub">delivered 45 days ago, undamaged</text>
  <!-- Node: verdict -->
  <rect x="1552" y="496" width="288" height="176" rx="16" class="mask"/>
  <rect x="1552" y="496" width="288" height="176" rx="16" class="soft"/>
  <rect x="1568" y="512" width="56" height="24" rx="4" class="tag-box"/>
  <text x="1596" y="530" text-anchor="middle" class="tag">EXP</text>
  <text x="1696" y="576" text-anchor="middle" class="name">0/3 achieved</text>
  <text x="1696" y="608" text-anchor="middle" class="sub">every score 0.00</text>
  <text x="1696" y="640" text-anchor="middle" class="sub">ws-sim-generated</text>
  <!-- Callout -->
  <path d="M 288 368 V 464" class="faint dash"/>
  <circle cx="288" cy="368" r="4" class="dot"/>
  <text x="80" y="512" class="note">The agent was right to refuse.</text>
  <text x="80" y="548" class="note">The case was wrong, not the answer.</text>
  <text x="80" y="600" class="sub">Keep the personas.</text>
  <text x="80" y="628" class="sub">Fix the scenario by hand.</text>
  <text x="80" y="656" class="sub">eq sim generate --datapoints cases.jsonl</text>
  <!-- Legend strip -->
  <line x1="80" y1="760" x2="1840" y2="760" class="hair"/>
  <text x="80" y="792" class="legend-title">LEGEND</text>
  <rect x="80" y="824" width="28" height="20" rx="4" class="alt"/>
  <text x="120" y="840" class="msg">Your input</text>
  <rect x="320" y="824" width="28" height="20" rx="4" class="node"/>
  <text x="360" y="840" class="msg">Model</text>
  <rect x="520" y="824" width="28" height="20" rx="4" class="focal"/>
  <text x="560" y="840" class="msg">Invented by the library</text>
  <rect x="880" y="824" width="28" height="20" rx="4" class="soft"/>
  <text x="920" y="840" class="msg">Fixture / orq entity</text>
  <line x1="1240" y1="836" x2="1296" y2="836" class="arrow"/>
  <text x="1312" y="840" class="msg">Flow</text>
  <line x1="1440" y1="836" x2="1496" y2="836" class="accent dash"/>
  <text x="1512" y="840" class="msg">Collides with the fixture</text>
    
</svg>
