<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refund agent chat · Lumen Goods support</title>
<style>
  /* Colours from docs/stylesheets/extra.css */
  :root {
    --teal: #025558; --teal-light: #299d8f; --orange-deep: #df5325; --orange-text: #c4421a;
    --ink: #25232e; --sand: #f9f8f6; --line: #dcd9d3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--sand);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--teal); color: #fff; padding: 0.75rem 1.25rem;
           display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header p { margin: 0; font-size: 0.85rem; opacity: 0.85; }
  main { flex: 1; width: 100%; max-width: 46rem; margin: 0 auto; padding: 1rem; }
  #log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { padding: 0.75rem 1rem; border-radius: 10px; line-height: 1.45; white-space: pre-wrap;
         max-width: 85%; }
  .user { align-self: flex-end; background: var(--teal); color: #fff; }
  .agent { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
  .error { align-self: flex-start; background: #fff; border: 1px solid var(--orange-deep);
           color: var(--orange-text); }
  .meta { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
          white-space: normal; font-size: 0.8rem; }
  .chip { background: var(--sand); border: 1px solid var(--line); border-radius: 999px;
          padding: 0.1rem 0.55rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .meta a { color: var(--teal); font-weight: 600; margin-left: auto; }
  form { position: sticky; bottom: 0; background: var(--sand); border-top: 1px solid var(--line);
         padding: 0.75rem 1rem; }
  .row { max-width: 46rem; margin: 0 auto; display: flex; gap: 0.5rem; align-items: flex-end; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
  .grow { flex: 1; }
  input { width: 100%; font: inherit; padding: 0.6rem 0.75rem; border: 1px solid #8a8792;
          border-radius: 8px; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 0.6rem 1.1rem; border-radius: 8px;
           border: 1px solid transparent; cursor: pointer; }
  #send { background: var(--orange-deep); color: #fff; }
  #send:disabled { opacity: 0.6; cursor: progress; }
  #reset { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.6); }
  :focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 2px; }
  header :focus-visible { outline-color: #fff; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Lumen Goods support</h1>
    <p>The workshop refund agent, through the orq AI Gateway. Try: "Refund ord_a1, I changed my mind."</p>
  </div>
  <button id="reset" type="button">New conversation</button>
</header>
<main>
  <ol id="log" aria-live="polite" aria-label="Conversation"></ol>
</main>
<form id="form">
  <div class="row">
    <div class="grow">
      <label for="message">Message</label>
      <input id="message" name="message" autocomplete="off" required
             placeholder="Hi, I want a refund for order ord_a1, I changed my mind.">
    </div>
    <button id="send" type="submit">Send</button>
  </div>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  let history = [];
  let conversationId = crypto.randomUUID();

  // textContent only: the answer is model output, never parsed as HTML.
  function add(kind, text) {
    const li = document.createElement("li");
    li.className = "msg " + kind;
    li.textContent = text;
    log.appendChild(li);
    li.scrollIntoView({ block: "end" });
    return li;
  }

  function addMeta(li, data) {
    const meta = document.createElement("div");
    meta.className = "meta";
    for (const name of data.tool_calls) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = name;
      meta.appendChild(chip);
    }
    if (data.trace_url) {
      const link = document.createElement("a");
      link.href = data.trace_url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "trace";
      link.title = "Open trace " + data.trace_id + " in orq.ai";
      meta.appendChild(link);
    }
    li.appendChild(meta);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add("user", message);
    input.value = "";
    send.disabled = true;
    const pending = add("agent", "Thinking…");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history, conversation_id: conversationId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data.detail ?? res.statusText));
      history = data.history;
      pending.textContent = data.answer || "(no answer)";
      addMeta(pending, data);
    } catch (err) {
      pending.className = "msg error";
      pending.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  document.getElementById("reset").addEventListener("click", () => {
    history = [];
    conversationId = crypto.randomUUID();
    log.replaceChildren();
    input.focus();
  });

  input.focus();
</script>
</body>
</html>
