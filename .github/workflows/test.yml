name: tests
# `make test` runs without network. The solution branch carries the finished run.py files, so it is tested too.
on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-groups
      - run: make test
