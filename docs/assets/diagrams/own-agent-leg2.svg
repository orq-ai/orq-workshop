<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720" role="img" aria-labelledby="own-loop-langgraph-title own-loop-langgraph-desc">
  <title id="own-loop-langgraph-title">A LangGraph agent traced through the orq gateway</title>
  <desc id="own-loop-langgraph-desc">Architecture diagram. Your process holds the LangGraph graph, the loop the framework runs, and the three tools. The graph calls the orq AI Gateway over the chat-completions endpoint and the gateway calls the model. A one-line callback ships spans to orq in the background, so the trace has to be found afterwards by run name rather than arriving on the response.</desc>
  <style>@import url("../../../scripts/diagram.css");</style>
  <defs><marker id="a" markerWidth="14" markerHeight="12" refX="12" refY="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 14 6 0 12z" fill="context-stroke"/></marker></defs>
  <rect width="1920" height="720" class="bg"/>
  <!-- Zones: the only thing that moves across the three diagrams is which side holds the loop -->
  <rect x="64" y="128" width="928" height="480" rx="20" class="zone"/>
  <rect x="88" y="136" width="208" height="24" rx="4" class="mask"/>
  <text x="96" y="154" class="zone-title">YOUR PROCESS</text>
  <rect x="1056" y="128" width="800" height="480" rx="20" class="zone"/>
  <rect x="1080" y="136" width="80" height="24" rx="4" class="mask"/>
  <text x="1088" y="154" class="zone-title">ORQ</text>
  <line x1="432" y1="296" x2="512" y2="296" class="arrow"/>
  <line x1="944" y1="296" x2="1088" y2="296" class="arrow"/>
  <line x1="1440" y1="296" x2="1488" y2="296" class="arrow"/>
  <line x1="736" y1="368" x2="736" y2="432" class="arrow"/>
  <line x1="944" y1="496" x2="1088" y2="496" class="arrow dash"/>
  <rect x="440" y="256" width="64" height="24" rx="4" class="mask"/>
  <text x="472" y="274" text-anchor="middle" class="lbl">ASK</text>
  <rect x="968" y="256" width="88" height="24" rx="4" class="mask"/>
  <text x="1012" y="274" text-anchor="middle" class="lbl">CALL</text>
  <rect x="752" y="384" width="72" height="24" rx="4" class="mask"/>
  <text x="788" y="402" text-anchor="middle" class="lbl">RUN</text>
  <rect x="960" y="456" width="104" height="24" rx="4" class="mask"/>
  <text x="1012" y="474" text-anchor="middle" class="lbl">SPANS</text>
  <rect x="112" y="224" width="320" height="144" rx="16" class="mask"/>
  <rect x="112" y="224" width="320" height="144" rx="16" class="node"/>
  <rect x="128" y="240" width="56" height="24" rx="4" class="tag-box solid"/>
  <text x="156" y="258" text-anchor="middle" class="tag t-ink">APP</text>
  <text x="272" y="308" text-anchor="middle" class="name">Your graph</text>
  <text x="272" y="344" text-anchor="middle" class="sub">create_react_agent</text>
  <rect x="528" y="224" width="416" height="144" rx="16" class="mask"/>
  <rect x="528" y="224" width="416" height="144" rx="16" class="focal"/>
  <rect x="544" y="240" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="572" y="258" text-anchor="middle" class="tag t-accent">LOOP</text>
  <text x="736" y="308" text-anchor="middle" class="name">The framework's loop</text>
  <text x="736" y="344" text-anchor="middle" class="sub">untouched by orq</text>
  <rect x="528" y="432" width="416" height="128" rx="16" class="mask"/>
  <rect x="528" y="432" width="416" height="128" rx="16" class="soft"/>
  <rect x="544" y="448" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="572" y="466" text-anchor="middle" class="tag">TOOL</text>
  <text x="736" y="516" text-anchor="middle" class="name">Tools</text>
  <text x="736" y="552" text-anchor="middle" class="sub">run here</text>
  <rect x="1104" y="224" width="336" height="144" rx="16" class="mask"/>
  <rect x="1104" y="224" width="336" height="144" rx="16" class="node"/>
  <rect x="1120" y="240" width="56" height="24" rx="4" class="tag-box solid"/>
  <text x="1148" y="258" text-anchor="middle" class="tag t-ink">GW</text>
  <text x="1272" y="308" text-anchor="middle" class="name">AI Gateway</text>
  <text x="1272" y="344" text-anchor="middle" class="sub">/chat/completions</text>
  <rect x="1488" y="224" width="320" height="144" rx="16" class="mask"/>
  <rect x="1488" y="224" width="320" height="144" rx="16" class="node"/>
  <rect x="1504" y="240" width="56" height="24" rx="4" class="tag-box solid"/>
  <text x="1532" y="258" text-anchor="middle" class="tag t-ink">LLM</text>
  <text x="1648" y="308" text-anchor="middle" class="name">Model</text>
  <rect x="1104" y="432" width="336" height="128" rx="16" class="mask"/>
  <rect x="1104" y="432" width="336" height="128" rx="16" class="soft"/>
  <rect x="1120" y="448" width="56" height="24" rx="4" class="tag-box accent"/>
  <text x="1148" y="466" text-anchor="middle" class="tag">TRC</text>
  <text x="1272" y="516" text-anchor="middle" class="name">Trace</text>
  <text x="1272" y="552" text-anchor="middle" class="sub">found by run name</text>
    
</svg>
