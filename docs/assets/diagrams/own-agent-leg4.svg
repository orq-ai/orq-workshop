<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720" role="img" aria-labelledby="own-loop-harness-title own-loop-harness-desc">
  <title id="own-loop-harness-title">A coding-agent harness routed through orq</title>
  <desc id="own-loop-harness-desc">Architecture sketch. On your machine a coding-agent harness such as pi, Claude Code or Codex runs the loop, and you wrote neither the loop nor the harness. It reads your repo, runs local tools like bash and edit, and calls the orq AI Gateway for every model call so the work is traced and budgeted. The orq MCP tools and orq skills, installed by orq connect, reach the harness over MCP. This arrangement is a sketch and is not built in the workshop.</desc>
