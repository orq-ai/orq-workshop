<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a search resolves · Reference</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Reference · How retrieval works</p>
    <h1>Indexed once, searched per query</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-pipeline-title rag-pipeline-desc">
      <title id="rag-pipeline-title">The retrieval pipeline, from documents to matches</title>
      <desc id="rag-pipeline-desc">Reference diagram. Indexing happens once per datasource: documents are chunked, each chunk is embedded, and text and vector are stored together in one index. Searching happens per query against that same index: retrieve by vector, keyword or hybrid, drop results below the threshold, cut to top_k, optionally rerank with its own model and limits, and return the matches with their scores.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <text x="72" y="80" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" letter-spacing="0.14em">ONCE, PER DATASOURCE</text>
      <text x="72" y="248" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" letter-spacing="0.14em">PER QUERY</text>

      <!-- Arrows first -->
      <line x1="296" y1="132" x2="336" y2="132" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="560" y1="132" x2="600" y2="132" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- the same index feeds every search -->
      <path d="M 744,168 V 208 Q 744,216 736,216 H 180 Q 172,216 172,224 V 264" fill="none" stroke="#025558" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- the per-query chain -->
      <line x1="272" y1="300" x2="296" y2="300" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="456" y1="300" x2="480" y2="300" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="300" x2="664" y2="300" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="776" y1="336" x2="776" y2="376" stroke="#df5325" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="380" y="196" width="112" height="12" rx="2" fill="#f9f8f6"/>
      <text x="384" y="205" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.06em">THE SAME INDEX</text>

      <!-- Indexing lane -->
      <rect x="72" y="96" width="224" height="72" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="184" y="128" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Chunk</text>
      <text x="184" y="146" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">strategy · size · overlap</text>

      <rect x="336" y="96" width="224" height="72" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="448" y="128" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Embed</text>
      <text x="448" y="146" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">one embedding model</text>

      <rect x="600" y="96" width="288" height="72" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="744" y="128" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Index</text>
      <text x="744" y="146" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">chunk text and vector, together</text>

      <!-- Search lane -->
      <rect x="72" y="264" width="200" height="72" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="172" y="296" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Retrieve</text>
      <text x="172" y="314" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">vector | keyword | hybrid</text>

      <rect x="296" y="264" width="160" height="72" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="376" y="296" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Threshold</text>
      <text x="376" y="314" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">drop low scores</text>

      <rect x="480" y="264" width="160" height="72" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="560" y="296" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">top_k</text>
      <text x="560" y="314" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">cut to size</text>

      <rect x="664" y="264" width="224" height="72" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="776" y="292" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Rerank · optional</text>
      <text x="776" y="310" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">own model, top_k, threshold</text>
      <text x="776" y="326" fill="#6b6975" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">retrieve 50, return 5</text>

      <!-- Output -->
      <rect x="72" y="376" width="816" height="48" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="80" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="94" y="393" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="480" y="396" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">matches</text>
      <text x="480" y="412" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">text · id · metadata · scores.search_score (+ rerank_score when a reranker ran)</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="60" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Indexing, done once</text>

      <rect x="216" y="472" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="236" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">A stage you configure</text>

      <rect x="408" y="472" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="428" y="480" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">What the search returns</text>
    </svg>
  </div>
</body>
</html>
