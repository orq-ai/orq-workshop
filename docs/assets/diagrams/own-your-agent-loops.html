<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who owns the loop · Build your own agent</title>
  <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../../stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../../stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent Mono"; src: url("../../stylesheets/fonts/ESKlarheitKurrentMono-Md.woff2") format("woff2"); font-weight: 500; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Build your own agent</p>
    <h1>Three loops, one gateway, one model</h1>

    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="own-your-agent-loops-title own-your-agent-loops-desc">
      <title id="own-your-agent-loops-title">Who owns the agentic loop: three shapes, one gateway</title>
      <desc id="own-your-agent-loops-desc">Architecture diagram showing the same question, instructions and tools sent through three shapes of agent: your own code calling chat(), a LangGraph graph invoked directly, and a managed agent invoked through responses.create. All three converge on the same AI Gateway and the same model, so the difference between them is only where the loop runs and who wrote it, not what the model or the gateway do.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#df5325"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#299d8f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f9f8f6"/>

      <!-- Column eyebrows -->
      <text x="76" y="128" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" letter-spacing="0.14em">A · YOUR CODE</text>
      <text x="388" y="128" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" letter-spacing="0.14em">B · A FRAMEWORK</text>
      <text x="700" y="128" fill="rgba(37,35,46,0.40)" font-size="7" font-family="'Kurrent Mono', monospace" letter-spacing="0.14em">C · ORQ</text>

      <!-- Arrows first: z-order puts them behind the nodes. -->
      <line x1="168" y1="88" x2="168" y2="136" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="480" y1="88" x2="480" y2="136" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="792" y1="88" x2="792" y2="136" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <line x1="168" y1="200" x2="168" y2="248" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="200" x2="480" y2="248" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="792" y1="200" x2="792" y2="248" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="480" y1="312" x2="480" y2="376" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels: masked, 6-10px clear of the stroke, on open canvas. -->
      <rect x="120" y="100" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="124" y="109" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CHAT()</text>
      <rect x="424" y="100" width="112" height="12" rx="2" fill="#f9f8f6"/>
      <text x="480" y="109" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">GRAPH.INVOKE()</text>
      <rect x="724" y="100" width="136" height="12" rx="2" fill="#f9f8f6"/>
      <text x="792" y="109" fill="#299d8f" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RESPONSES.CREATE()</text>

      <rect x="112" y="212" width="112" height="12" rx="2" fill="#f9f8f6"/>
      <text x="168" y="221" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RESPONSES API</text>
      <rect x="412" y="212" width="136" height="12" rx="2" fill="#f9f8f6"/>
      <text x="480" y="221" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CHAT COMPLETIONS</text>
      <rect x="736" y="212" width="112" height="12" rx="2" fill="#f9f8f6"/>
      <text x="792" y="221" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RESPONSES API</text>

      <rect x="432" y="336" width="96" height="12" rx="2" fill="#f9f8f6"/>
      <text x="480" y="345" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.02em">MODEL CALL</text>

      <!-- Node: the same input (focal, top bar) -->
      <rect x="72" y="40" width="816" height="48" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="40" width="816" height="48" rx="6" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <rect x="80" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(223,83,37,0.50)" stroke-width="0.8"/>
      <text x="94" y="57" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="480" y="60" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">The same question, instructions and tools</text>
      <text x="480" y="76" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">"Refund ord_a2 please, the dock does not fit my laptop."</text>

      <!-- Node: Your app (A) -->
      <rect x="72" y="136" width="192" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="80" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="94" y="153" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
      <text x="168" y="172" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Your app</text>
      <text x="168" y="188" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">the loop is yours</text>

      <!-- Node: LangGraph (B) -->
      <rect x="384" y="136" width="192" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="384" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="392" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.40)" stroke-width="0.8"/>
      <text x="406" y="153" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LG</text>
      <text x="480" y="172" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">LangGraph</text>
      <text x="480" y="188" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">the loop is the framework's</text>

      <!-- Node: Managed agent (C, orq entity) -->
      <rect x="696" y="136" width="192" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="696" y="136" width="192" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="704" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="718" y="153" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="792" y="172" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Managed agent</text>
      <text x="792" y="188" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">the loop is orq's</text>

      <!-- Node: AI Gateway (orq entity, spans all three columns) -->
      <rect x="72" y="248" width="816" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="248" width="816" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="80" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(2,85,88,0.50)" stroke-width="0.8"/>
      <text x="94" y="265" fill="#025558" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="480" y="284" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">AI Gateway</text>
      <text x="480" y="300" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">routes, budgets, caches and traces every call above</text>

      <!-- Node: Model (external, bottom bar) -->
      <rect x="72" y="376" width="816" height="48" rx="6" fill="#f9f8f6"/>
      <rect x="72" y="376" width="816" height="48" rx="6" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <rect x="80" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(37,35,46,0.22)" stroke-width="0.8"/>
      <text x="94" y="393" fill="#6b6975" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="480" y="396" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Model</text>
      <text x="480" y="412" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">openai/gpt-5.6-luna · the same model, three ways in</text>

      <!-- Legend strip -->
      <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="484" width="14" height="10" rx="2" fill="rgba(223,83,37,0.08)" stroke="#df5325" stroke-width="1"/>
      <text x="60" y="492" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">The same in all three</text>

      <rect x="212" y="484" width="14" height="10" rx="2" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <text x="232" y="492" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Your code</text>

      <rect x="332" y="484" width="14" height="10" rx="2" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <text x="352" y="492" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">orq entity</text>

      <rect x="440" y="484" width="14" height="10" rx="2" fill="rgba(37,35,46,0.03)" stroke="rgba(37,35,46,0.30)" stroke-width="1"/>
      <text x="460" y="492" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Provider model</text>

      <line x1="576" y1="490" x2="604" y2="490" stroke="#299d8f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="612" y="492" fill="#025558" font-size="8" font-family="'Avio Sans', sans-serif">Entry call from your code</text>
    </svg>
  </div>
</body>
</html>
