    <style>
    /* orq brand fonts, self-hosted in docs/stylesheets/fonts (see docs/stylesheets/extra.css). */
    @font-face { font-family: "Avio Sans"; src: url("../stylesheets/fonts/AvioSans-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Avio Sans"; src: url("../stylesheets/fonts/AvioSans-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Avio Sans"; src: url("../stylesheets/fonts/AvioSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "Kurrent"; src: url("../stylesheets/fonts/ESKlarheitKurrent-Smbd.woff2") format("woff2"); font-weight: 600; font-style: normal; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f9f8f6;   /* orq sand */
      --color-ink:    #25232e;   /* orq ink */
      --color-muted:  #025558;   /* orq teal */
      --color-accent: #df5325;   /* orq orange-deep */
      --font-sans:  'Avio Sans', system-ui, sans-serif;
      --font-title: 'Kurrent', 'Avio Sans', sans-serif;
      --font-mono:  'Kurrent Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Build your own agent</p>
    <h1>Leg 3 · orq runs the loop</h1>

    <svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="own-loop-managed-title own-loop-managed-desc">
      <title id="own-loop-managed-title">A managed agent whose loop runs server-side</title>
      <desc id="own-loop-managed-desc">Architecture diagram. Your process posts a question to a managed agent and the loop runs inside orq, where the instructions, model and tool schemas are configuration rather than code. The agent sends function_call items back to your process, which executes the tools locally and returns the results, and orq calls the model itself.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#025558"/></marker>

      </defs>
      <rect width="100%" height="100%" fill="#f9f8f6"/>
      <!-- Zones: the only thing that moves across the three diagrams is which side holds the loop -->
      <rect x="32" y="64" width="464" height="240" rx="8" fill="rgba(37,35,46,0.02)" stroke="rgba(37,35,46,0.10)" stroke-width="0.8"/>

      <line x1="544" y1="180" x2="216" y2="180" stroke="#025558" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="136" y1="196" x2="136" y2="224" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="712" y1="192" x2="712" y2="224" stroke="#025558" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="332" y="120" width="60" height="12" rx="2" fill="#f9f8f6"/>

      <rect x="144" y="200" width="36" height="12" rx="2" fill="#f9f8f6"/>
      <text x="162" y="209" fill="#025558" font-size="8" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>
      <rect x="56" y="120" width="160" height="76" rx="6" fill="#f9f8f6"/>
      <rect x="56" y="120" width="160" height="76" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>

      <text x="136" y="180" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">executes the</text>
      <text x="136" y="194" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">function_call items</text>
      <rect x="56" y="224" width="160" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="56" y="224" width="160" height="64" rx="6" fill="rgba(37,35,46,0.05)" stroke="#025558" stroke-width="1"/>
      <rect x="64" y="232" width="28" height="12" rx="2" fill="transparent" stroke="#025558" stroke-opacity="0.45" stroke-width="0.8"/>

      <text x="136" y="284" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">still run here</text>

      <text x="582" y="129" fill="#df5325" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="732" y="154" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">The loop runs in orq</text>
      <text x="732" y="172" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">agent/&lt;key&gt; · instructions,</text>
      <text x="732" y="186" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">model and tools are config</text>
      <rect x="632" y="224" width="272" height="64" rx="6" fill="#f9f8f6"/>
      <rect x="632" y="224" width="272" height="64" rx="6" fill="#ffffff" stroke="#25232e" stroke-width="1"/>
      <rect x="640" y="232" width="28" height="12" rx="2" fill="transparent" stroke="#25232e" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="654" y="241" fill="#25232e" font-size="7" font-family="'Kurrent Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="768" y="266" fill="#25232e" font-size="12" font-weight="600" font-family="'Avio Sans', sans-serif" text-anchor="middle">Model</text>
      <text x="768" y="284" fill="#025558" font-size="9" font-family="'Kurrent Mono', monospace" text-anchor="middle">orq calls it, not you</text>

    </svg>
